<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">

<title>Congo Capoeira Calendar (CCC)</title>
<link rel="icon" type="image/png" sizes="64x64" href="img/favicon-64.png">
<link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Theme taken from the "Upcoming events · Confirmed capoeira travels" poster:
   near-black navy, blue bokeh, orange accent, light-grey date chips, condensed uppercase type. */
:root {
  --bg: #F0F0EE; --surface: #FFFFFF; --surface-2: #ECECE9; --ink: #0D141B; --muted: #59636D; --line: #D8D9D5;
  --gold: #B8861B; --green: #2F7D4F; --blue: #2B5FA6; --violet: #7A4A9A; --ok: #1F7A45;
  --orange: #E08A3C; --orange-ink: #B05A14; --chip: #D9D9D9; --chip-ink: #0D141B;
  --accent: var(--orange-ink); --bar: #D9772B; --tabbar: #0B121A;
  --sea: #E4E8EC; --land: #FFFFFF; --visited: #F3C9A2;
  --panel: #0B121A; --on-panel: #FFFFFF; --on-panel-muted: #AEBBC8;
  --display: "Oswald", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 14px; color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #070B10; --surface: #101820; --surface-2: #17222D; --ink: #F2F2F2; --muted: #98A4B0; --line: #22303D;
  --gold: #E2B048; --green: #5DBB83; --blue: #6F9EE6; --violet: #B98BD9; --ok: #2E9A5B;
  --accent: var(--orange); --orange-ink: #E08A3C; --bar: #E08A3C; --tabbar: #0B121A;
  --sea: #0C1620; --land: #1B2632; --visited: #5A3A1E; color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root[data-theme="system"] {
    --bg: #070B10; --surface: #101820; --surface-2: #17222D; --ink: #F2F2F2; --muted: #98A4B0; --line: #22303D;
    --gold: #E2B048; --green: #5DBB83; --blue: #6F9EE6; --violet: #B98BD9; --ok: #2E9A5B;
    --accent: var(--orange); --orange-ink: #E08A3C; --bar: #E08A3C; --tabbar: #0B121A;
    --sea: #0C1620; --land: #1B2632; --visited: #5A3A1E; color-scheme: dark;
  }
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); -webkit-font-smoothing: antialiased;
  padding: 0; }
button { font: inherit; color: inherit; }
a { color: var(--blue); }
/* App shell: header and tab bar stay put, only the middle scrolls */
.app { height: 100%; display: flex; flex-direction: column; position: relative; }
#main { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  padding: 14px max(12px, env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
#main > .inner { max-width: 760px; margin: 0 auto; display: grid; gap: 14px; }
.lbl { font: 500 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

/* Header */
.mast { flex: none; position: relative; overflow: hidden; color: var(--on-panel); margin: 0; padding: max(18px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) 0 max(20px, env(safe-area-inset-left)); transition: padding .2s;
  background: linear-gradient(90deg, rgba(0,38,76,.7), rgba(0,38,76,.25) 70%, rgba(0,38,76,0)), url(img/bg-bokeh.webp) center / cover, var(--panel);
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 8px; }
@media (min-width: 800px) { .mast { padding-left: calc(50% - 360px); padding-right: calc(50% - 360px); } header.mast > .diamond { right: calc(50% - 342px); } }
.mast::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 6px;
  background: repeating-linear-gradient(115deg, #B8861B 0 8px, #2F7D4F 8px 16px, #2B5FA6 16px 24px, #7A4A9A 24px 32px); }
.mast .copy { padding-bottom: 22px; min-width: 0; }
.mast.compact .brand { padding-right: 96px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand img { height: 56px; width: auto; }
.brand .lbl { color: var(--on-panel-muted); }
h1 { font: 800 clamp(26px, 7vw, 40px)/1 var(--display); margin: 14px 0 8px; letter-spacing: -.01em; }
h1 span { display: block; color: var(--orange); font-weight: 600; font-size: .45em; letter-spacing: .02em; margin-top: 6px; }
.sync { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--on-panel-muted); background: rgba(0,0,0,.22); border-radius: 999px; padding: 5px 12px 5px 10px; margin-top: 4px; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: #9BB0C4; }
.mast .photo { height: 168px; width: auto; display: block; position: relative; z-index: 1; margin-bottom: 6px; }
.mast .diamond { position: absolute; right: 18px; bottom: 26px; width: 130px; height: 130px; background: var(--orange); transform: rotate(45deg) scale(1,.78); border-radius: 6px; }
.mast .diamond::after { content: ""; position: absolute; inset: 22%; border-radius: 50%; background: var(--panel); }
.mast.compact { padding-top: max(12px, env(safe-area-inset-top)); }
.mast.compact .copy { padding-bottom: 16px; }
.mast.compact h1 { font-size: 20px; margin: 8px 0 0; }
.mast.compact h1 span, .mast.compact .sync, .mast.compact .photo, .mast.compact .diamond { display: none; }
.mast.compact .brand img { height: 40px; }
.page-h { font: 800 22px var(--display); margin: 4px 2px 0; }

/* Language dropdown */
.langdd { position: absolute; top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); z-index: 30; }
@media (min-width: 800px) { .langdd { right: calc(50% - 370px); } }
.langdd > button { display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 999px; padding: 6px 10px 6px 8px; background: rgba(0,20,40,.45); color: #fff; font: 600 13px var(--body); cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.langdd > button .fl { font-size: 20px; line-height: 1; }
.langdd > button .car { font-size: 10px; opacity: .8; }
.langdd ul { position: absolute; right: 0; top: calc(100% + 6px); margin: 0; padding: 6px; list-style: none; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.25); min-width: 190px; }
.langdd li button { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; padding: 9px 10px; border-radius: 10px; cursor: pointer; font-size: 14.5px; text-align: left; }
.langdd li button:hover, .langdd li button:focus-visible { background: var(--surface-2); }
.langdd li button .fl { font-size: 20px; }
.langdd li button[aria-checked="true"] { font-weight: 600; }
.langdd li button[aria-checked="true"]::after { content: "✓"; margin-left: auto; color: var(--blue); }

/* Upcoming */
.next { background: var(--surface); border-radius: var(--r); padding: 14px 14px 8px; border: 1px solid var(--line); }
.next > .lbl { display: flex; justify-content: space-between; padding: 0 4px 8px; }
.up { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 12px; align-items: center; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 12px 4px; cursor: pointer; }
.up:first-of-type { border-top: 0; }
.up:hover h2 { text-decoration: underline; text-decoration-thickness: 1px; }
.datebox { width: 52px; text-align: center; border-radius: 12px; padding: 5px 0 6px; background: var(--surface-2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.datebox b { display: block; font: 800 20px/1 var(--display); }
.datebox small { font: 500 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.up.first .datebox { width: 60px; background: var(--panel); color: #fff; box-shadow: none; }
.up.first .datebox b { font-size: 26px; }
.up.first .datebox small { color: var(--orange); }
.up h2 { font: 600 15px/1.25 var(--body); margin: 0 0 1px; overflow-wrap: anywhere; }
.up.first h2 { font: 600 17px/1.25 var(--display); }
.up .meta { color: var(--muted); font-size: 13px; }
.countdown { text-align: right; font: 800 18px/1 var(--display); color: var(--accent); white-space: nowrap; }
.up.first .countdown { font-size: 26px; }
.countdown small { display: block; font: 500 11px var(--mono); color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-top: 4px; }
.link-btn { justify-self: center; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 9px 18px; cursor: pointer; font-weight: 600; font-size: 14px; }

/* Controls */
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; position: sticky; top: -14px; margin-top: -14px; padding-top: 14px !important; z-index: 5; background: var(--bg); padding: 8px 0; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: none; padding: 7px 14px; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--panel); color: #fff; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 11px; font-size: 13px; cursor: pointer; }
.chip i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.chip[aria-pressed="false"] { opacity: .45; }
.chip[aria-pressed="false"] i { background: none; box-shadow: inset 0 0 0 1.5px var(--c); }

/* Agenda list */
.month-h { font: 600 13px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 18px 4px 8px; display: flex; justify-content: space-between; }
.list { display: grid; gap: 8px; }
.ev { display: grid; grid-template-columns: 58px minmax(0,1fr) auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--c); border-radius: 12px; padding: 10px 12px; cursor: pointer; text-align: left; width: 100%; }
.ev:hover { border-color: var(--muted); border-left-color: var(--c); }
.ev .d { text-align: center; }
.ev .d b { display: block; font: 800 20px/1 var(--display); white-space: nowrap; letter-spacing: -.02em; }
.ev .d b span { font-size: .6em; }
.ev .d small { font: 500 10.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.ev h3 { margin: 0; font-size: 15.5px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.ev .meta { font-size: 13px; color: var(--muted); }
.tag { font: 500 10.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--c); white-space: nowrap; }
.ev.past { opacity: .55; }
.ev.now { box-shadow: 0 0 0 2px var(--orange); }
.pastbtn { justify-self: center; margin-top: 4px; border: 1px dashed var(--line); background: none; border-radius: 999px; padding: 7px 16px; cursor: pointer; color: var(--muted); font-size: 13.5px; }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; }
.ok { display: inline-flex; align-items: center; gap: 4px; font: 600 11px var(--mono); letter-spacing: .04em; text-transform: uppercase; color: #fff; background: var(--ok); border-radius: 999px; padding: 2px 8px 2px 6px; white-space: nowrap; vertical-align: 2px; margin-left: 4px; }

/* Month */
.cal { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
.cal-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; gap: 8px; }
.cal-h h2 { font: 600 18px var(--display); margin: 0; text-transform: capitalize; }
.nav { display: flex; gap: 6px; }
.nav button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; min-width: 38px; height: 36px; cursor: pointer; font-size: 16px; padding: 0 10px; }
.nav button.today { font-size: 13px; font-weight: 600; }
.nav button:disabled { opacity: .35; cursor: default; }
.grid { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 3px; }
.dow { font: 500 10.5px var(--mono); text-transform: uppercase; color: var(--muted); text-align: center; padding: 4px 0; }
.day { min-height: 64px; border-radius: 9px; background: var(--surface-2); padding: 4px; display: flex; flex-direction: column; gap: 2px; border: 0; text-align: left; cursor: default; min-width: 0; }
.day.out { background: none; }
.day.out .n { opacity: .35; }
.day .n { font-size: 12.5px; font-weight: 600; padding-left: 2px; }
.day.is-today .n { background: var(--orange); color: #0B2A45; border-radius: 6px; padding: 0 5px; align-self: flex-start; }
.day.has { cursor: pointer; }
.day.sel { outline: 2px solid var(--panel); }
.bar-ev { display: block; font-size: 10.5px; line-height: 1.35; color: #fff; background: var(--c); border-radius: 4px; padding: 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-ev.cont { border-top-left-radius: 0; border-bottom-left-radius: 0; margin-left: -4px; }
@media (max-width: 480px) { .day { min-height: 50px; } .bar-ev { font-size: 0; height: 6px; padding: 0; } }
.daylist { margin-top: 12px; display: grid; gap: 8px; }
.daylist .hint { color: var(--muted); font-size: 13.5px; text-align: center; padding: 6px; }

/* Year */
.year { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
.mini { display: block; height: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px; cursor: pointer; text-align: left; }
.mini:hover { border-color: var(--muted); }
.mini h3 { margin: 0 0 6px; font: 600 13px var(--display); display: flex; justify-content: space-between; text-transform: capitalize; }
.mini h3 small { font: 500 11px var(--mono); color: var(--muted); }
.mini .g { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.mini .g span { aspect-ratio: 1; border-radius: 3px; font-size: 9px; display: grid; place-items: center; color: var(--muted); }
.mini .g span.on { background: var(--c); color: #fff; font-weight: 600; }
.mini .g span.td { box-shadow: inset 0 0 0 1.5px var(--orange); }
.yearhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.yearhead h2 { font: 800 22px var(--display); margin: 0; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
.stats.s3 { grid-template-columns: repeat(3, 1fr); }
.tabs button { position: relative; }
.ntbadge { position: absolute; top: 4px; left: 50%; margin-left: 6px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: #E5484D; color: #fff; font: 700 11px/17px var(--body); text-align: center; }
.ntlist { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 8px; }
.ntlist li { display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; align-items: center; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
.ntlist .tx { font-size: 14px; } .ntlist .tx[data-id] { cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
.ntlist .btn { padding: 6px 12px; }
.ntcount { display: inline-block; min-width: 22px; padding: 0 6px; border-radius: 11px; background: #E5484D; color: #fff; font-size: 13px; text-align: center; vertical-align: middle; }
.wx { margin: 4px 0; } .wx:empty { display: none; }
.wxdays { display: flex; gap: 8px; overflow-x: auto; margin: 6px 0 4px; }
.wxd { flex: 0 0 auto; min-width: 74px; display: grid; justify-items: center; gap: 2px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 8px 6px; }
.wxd b { font-size: 24px; line-height: 1.1; } .wxd span { font-weight: 600; } .wxd i { font-style: normal; color: var(--muted); font-weight: 400; } .wxd small, .wxsrc { color: var(--muted); font-size: 12px; }
.vgbox video { display: block; width: 100%; max-width: 360px; margin: 10px auto 14px; border-radius: 16px; background: #000; aspect-ratio: 780 / 1328; }
.vgchips { margin-top: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 4px; text-align: center; }
.stat b { display: block; font: 800 22px/1.1 var(--display); color: var(--accent); }
.stat small { font-size: 11.5px; color: var(--muted); }

/* Analytics */
.st-scope { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.st-scope button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 13px; font-size: 13.5px; font-weight: 600; cursor: pointer; color: var(--muted); }
.st-scope button[aria-pressed="true"] { background: var(--panel); color: #fff; border-color: var(--panel); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px 12px; margin-top: 10px; }
.card h3 { font: 600 15px var(--display); margin: 0 0 2px; }
.card .sub { color: var(--muted); font-size: 12.5px; margin: 0 0 12px; }
.hb { display: grid; grid-template-columns: minmax(84px, 36%) minmax(0,1fr) 2.6em; gap: 8px; align-items: center; font-size: 13.5px; padding: 3px 0; border-radius: 6px; }
.hb:hover { background: var(--surface-2); }
.hb .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hb .tr { height: 14px; display: flex; gap: 2px; }
.hb .tr i { display: block; height: 100%; background: var(--c, var(--bar)); border-radius: 0 4px 4px 0; min-width: 3px; }
.hb .tr i.done:not(:last-child) { border-radius: 0; }
.hb .tr i.plan, .legend i.plan { background: repeating-linear-gradient(135deg, var(--bar) 0 3px, transparent 3px 6px); box-shadow: inset 0 0 0 1.5px var(--bar); }
.hb .v { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin: -4px 0 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 10px; border-radius: 2px; background: var(--bar); }
.cols { display: grid; grid-template-columns: repeat(12, minmax(0,1fr)); gap: 4px; align-items: end; height: 120px; padding-top: 16px; border-bottom: 1px solid var(--line); }
.cols div { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; font-size: 11px; font-weight: 600; }
.cols i { display: block; width: 100%; max-width: 30px; background: var(--bar); border-radius: 4px 4px 0 0; margin-top: 2px; }
.colx { display: grid; grid-template-columns: repeat(12, minmax(0,1fr)); gap: 4px; font: 500 10px var(--mono); color: var(--muted); text-align: center; padding-top: 4px; text-transform: uppercase; }
.two { display: grid; grid-template-columns: 1fr; gap: 0 10px; }
@media (min-width: 700px) { .two { grid-template-columns: 1fr 1fr; } }
.more { background: none; border: 0; color: var(--blue); font-size: 13px; font-weight: 600; cursor: pointer; padding: 6px 0 0; }

/* Map */
.mapwrap { position: relative; border-radius: 12px; overflow: hidden; background: var(--sea); }
.mapwrap svg { display: block; width: 100%; height: auto; }
.map-land { fill: var(--land); stroke: var(--surface); stroke-width: .6; }
.map-dot { fill: var(--bar); stroke: var(--surface); stroke-width: 2; cursor: pointer; }
.map-dot.sel { fill: var(--gold); }
.map-lbl { font: 600 11px var(--body); fill: var(--ink); paint-order: stroke; stroke: var(--sea); stroke-width: 3px; stroke-linejoin: round; pointer-events: none; }
.map-cap { font-size: 13px; color: var(--muted); margin: 8px 0 0; min-height: 1.5em; }
.map-cap b { color: var(--ink); }
.maptoggle { margin-bottom: 10px; }
.maplegend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 6px; align-items: center; }
.maplegend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; }

/* Settings */
.set { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 4px 16px; }
.set h3 { font: 600 15px var(--display); margin: 14px 0 10px; }
.opts { display: grid; gap: 6px; padding-bottom: 14px; }
.opts.row { grid-template-columns: repeat(3, 1fr); }
.opt { display: flex; align-items: center; gap: 10px; border: 1.5px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 11px 12px; cursor: pointer; text-align: left; font-weight: 500; }

function monthCells(first) {

function drawMap() {
  const svgEl = document.getElementById("map");
  if (!svgEl || !window.d3) { if (svgEl) svgEl.closest(".card").hidden = true; return; }
  const evs = (state.stScope === "all" ? EVENTS : EVENTS.filter(e => e.S.getUTCFullYear() === +state.stScope)).filter(e => !isMissed(e) && e.E < TODAY);
  const byCC = d3.rollup(evs, v => v.length, e => e.cc);
  const byCity = d3.rollup(evs.filter(e => CITIES[e.place]), v => v.length, e => e.place);
  const eu = state.mapView === "europe", wd = state.mapView === "world", am = state.mapView === "americas", gl = wd || am;
  const w = 600, h = wd ? 330 : am ? 640 : eu ? 520 : 560;
  const ext = am ? [-125, -56, -34, 52] : eu ? [-6, 37, 30, 57] : [2.4, 49.9, 7.2, 53.2];
  const bbox = { type: "MultiPoint", coordinates: [[ext[0], ext[1]], [ext[2], ext[1]], [ext[2], ext[3]], [ext[0], ext[3]], [(ext[0] + ext[2]) / 2, ext[1]], [(ext[0] + ext[2]) / 2, ext[3]]] };
  const proj = wd ? d3.geoNaturalEarth1().rotate([-10, 0]).fitExtent([[4, 4], [w - 4, h - 4]], { type: "Sphere" })
    : am ? d3.geoNaturalEarth1().rotate([80, 0]).fitExtent([[0, 0], [w, h]], bbox)
    : (eu ? d3.geoConicConformal().rotate([-12, 0]).parallels([40, 58]) : d3.geoMercator()).fitExtent([[0, 0], [w, h]], bbox);
  const path = d3.geoPath(proj);
  const svg = d3.select(svgEl).attr("viewBox", `0 0 ${w} ${h}`);
  svg.selectAll("*").remove();
  const NUM2 = Object.fromEntries(Object.entries(ISO_NUM).map(([a, n]) => [n, a]));
  const ccOfF = f => gl ? NUM2[f.id] : f.id;
  if (wd) svg.append("path").attr("d", path({ type: "Sphere" })).attr("fill", "var(--sea)");
  svg.append("g").selectAll("path").data(gl ? WORLD.features : EUROPE.features).join("path").attr("class", "map-land").attr("d", path)
    .style("fill", f => byCC.get(ccOfF(f)) ? "var(--visited)" : null)
    .append("title").text(f => ccOfF(f) ? `${country(ccOfF(f))}: ${byCC.get(ccOfF(f)) || 0}` : "");
  const max = d3.max([...byCity.values()]) || 1;
  const r = n => (wd ? 3.5 : eu || am ? 4 : 6) + (wd ? 3 : eu || am ? 4 : 7) * Math.sqrt((n - 1) / Math.max(1, max - 1));
  const pts = [...byCity].map(([c, n]) => ({ c, n, xy: proj([CITIES[c][1], CITIES[c][0]]) }))
    .filter(p => p.xy[0] > 0 && p.xy[0] < w && p.xy[1] > 0 && p.xy[1] < h).sort((a, b) => a.n - b.n);
  const sel = c => { state.mapSel = c; const n = byCity.get(c); document.getElementById("mapcap").innerHTML = c ? `${flag(evs.find(e => e.place === c)?.cc)} <b>${esc(c)}</b> · ${n === 1 ? t("nEvent") : t("nEvents", { n })}` : t("tapCity"); svg.selectAll(".map-dot").classed("sel", p => p.c === c); };
  // invisible bigger hit areas first, then the visible dots
  svg.append("g").selectAll("circle").data(pts).join("circle").attr("cx", p => p.xy[0]).attr("cy", p => p.xy[1]).attr("r", p => r(p.n) + 9).attr("fill", "transparent").style("cursor", "pointer").on("click", (ev, p) => sel(p.c));
  svg.append("g").selectAll("circle").data(pts).join("circle").attr("class", "map-dot").attr("cx", p => p.xy[0]).attr("cy", p => p.xy[1]).attr("r", p => r(p.n)).on("click", (ev, p) => sel(p.c))
    .append("title").text(p => `${p.c}: ${p.n}`);
  // labels: biggest first, skip any that would overlap one already placed
  const dotBox = p => [p.xy[0] - r(p.n) - 1, p.xy[1] - r(p.n) - 1, p.xy[0] + r(p.n) + 1, p.xy[1] + r(p.n) + 1];
  const placed = pts.map(dotBox), lbl = svg.append("g");
  for (const p of [...pts].sort((a, b) => b.n - a.n)) {
    if (eu && p.n < 2 && !["Paris", "Izmir", "Piła", "Nailloux", "Lille", "Aachen"].includes(p.c)) continue;
    const [lat, lon] = CITIES[p.c];
    if (wd && lon > -25 && lon < 45 && lat > 34) continue;   // Europe is labelled as one group below
    const text = p.n > 1 ? `${p.c} ${p.n}` : p.c, tw = text.length * 6.9, th = 13;
    const cands = [[p.xy[0] + r(p.n) + 4, p.xy[1] + 4, "start"], [p.xy[0] - r(p.n) - 4, p.xy[1] + 4, "end"], [p.xy[0], p.xy[1] - r(p.n) - 5, "middle"], [p.xy[0], p.xy[1] + r(p.n) + 13, "middle"]];
    for (const [x, y, anchor] of cands) {
      const x0 = anchor === "start" ? x : anchor === "end" ? x - tw : x - tw / 2, box = [x0, y - th + 3, x0 + tw, y + 3];
      if (box[0] < 2 || box[2] > w - 2 || box[1] < 2 || box[3] > h - 2) continue;
      if (placed.some(b => !(box[2] < b[0] || box[0] > b[2] || box[3] < b[1] || box[1] > b[3]))) continue;
      placed.push(box); lbl.append("text").attr("class", "map-lbl").attr("x", x).attr("y", y).attr("text-anchor", anchor).text(text); break;
    }
  }
  if (wd) {
    const euN = [...byCity.keys()].filter(c => { const [lat, lon] = CITIES[c]; return lon > -25 && lon < 45 && lat > 34; }).length;
    const [x, y] = proj([4, 58]);
    if (euN) lbl.append("text").attr("class", "map-lbl").attr("x", x).attr("y", y).attr("text-anchor", "middle").text(`${t("europe")} · ${euN} ${t("cities")}`);
  }
  const off = [...byCity.keys()].filter(c => !pts.some(p => p.c === c));
  const cap = document.getElementById("mapcap");
  cap.dataset.off = off.length && !gl ? t("offMap", { x: off.join(", ") }) : "";
  if (state.mapSel && byCity.has(state.mapSel)) sel(state.mapSel); else if (cap.dataset.off) cap.innerHTML = `${t("tapCity")} · ${esc(cap.dataset.off)}`;
}

// ---- Weather forecast: from 3 days before an event until it has passed (Open-Meteo, no key) ----
const WX = new Map();
const WXI = c => c === 0 ? "☀️" : c <= 2 ? "🌤️" : c === 3 ? "☁️" : c <= 48 ? "🌫️" : c <= 57 ? "🌦️" : c <= 67 ? "🌧️" : c <= 77 ? "🌨️" : c <= 82 ? "🌧️" : c <= 86 ? "🌨️" : "⛈️";

function wxHtml(e) {
  if (!wxWanted(e)) return "";
  const d = WX.get(e.id);
  if (!d) { wxLoad(e); return `<div class="wx" data-wx="${e.id}"></div>`; }
  if (d === "err" || d === "wait") return `<div class="wx" data-wx="${e.id}"></div>`;
  return `<div class="wx" data-wx="${e.id}"><div class="lbl">🌦️ ${t("wxH")}</div><div class="wxdays">${d.map(x => `<div class="wxd"><small>${esc(fmtWxDay(x.day))}</small><b>${WXI(x.code)}</b><span>${Math.round(x.max)}° <i>${Math.round(x.min)}°</i></span>${x.rain != null ? `<small>💧 ${x.rain}%</small>` : ""}</div>`).join("")}</div><small class="wxsrc">${esc(t("wxSrc", { p: e.place }))}</small></div>`;
}
const fmtWxDay = iso => { const d = D(iso); return `${d.toLocaleDateString(LANG, { weekday: "short", timeZone: "UTC" })} ${d.getUTCDate()}`; };
async function wxLoad(e) {
  WX.set(e.id, "wait");
  try {
    const [lat, lon] = CITIES[e.place], from = e.S < TODAY ? TODAY : e.S;
    const iso = d => d.toISOString().slice(0, 10), endD = new Date(Math.min(+e.E, +TODAY + 15 * 864e5));
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&start_date=${iso(from)}&end_date=${iso(endD < from ? from : endD)}`;
    const r = await fetch(u); if (!r.ok) throw 0; const j = await r.json(), dd = j.daily;
    WX.set(e.id, dd.time.map((day, i) => ({ day, code: dd.weather_code[i], max: dd.temperature_2m_max[i], min: dd.temperature_2m_min[i], rain: dd.precipitation_probability_max?.[i] ?? null })));
  } catch { WX.set(e.id, "err"); return; }
  const box = document.querySelector(`[data-wx="${e.id}"]`); if (box) box.outerHTML = wxHtml(e);
}

function safeDescription(html) {
  // Keep text, line breaks, bold, lists and links; drop everything else.
  const doc = new DOMParser().parseFromString(`<div>${html}</div>`, "text/html");
  const walk = node => [...node.childNodes].map(n => {
    if (n.nodeType === 3) return esc(n.textContent).replace(/\r?\n/g, "<br>");
    if (n.nodeType !== 1) return "";
    const tag = n.tagName.toLowerCase(), inner = walk(n);
    if (tag === "br") return "<br>";
    if (tag === "a") { const h = n.getAttribute("href") || ""; if (!/^https?:/i.test(h)) return inner; let label = n.textContent; try { if (label === h || label.length > 40) label = new URL(h).hostname.replace(/^www\./, "") + " ↗"; } catch {} return `<a href="${esc(h)}" target="_blank" rel="noopener">${esc(label)}</a>`; }
    if (["b", "strong", "i", "em", "u", "ul", "ol", "li", "p"].includes(tag)) return `<${tag}>${inner}</${tag}>`;
    return inner;
  }).join("");
  return walk(doc.body.firstChild).replace(/(<br>\s*){3,}/g, "<br><br>").trim();
}

}

  const s = Math.max(W / bg.width, H / bg.height); x.drawImage(bg, (W - bg.width * s) / 2, (H - bg.height * s) / 2, bg.width * s, bg.height * s);
  const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "rgba(7,11,16,.15)"); g.addColorStop(.45, "rgba(7,11,16,.55)"); g.addColorStop(1, "rgba(7,11,16,.85)");
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  // photo in black and white, right side
  const ph = 560, pw = photo.width * ph / photo.height, pc = document.createElement("canvas"); pc.width = pw; pc.height = ph;
  const px = pc.getContext("2d"); px.drawImage(photo, 0, 0, pw, ph);
  const id = px.getImageData(0, 0, pw, ph), d = id.data;
  for (let i = 0; i < d.length; i += 4) { let v = .299 * d[i] + .587 * d[i + 1] + .114 * d[i + 2]; v = Math.max(0, Math.min(255, (v - 128) * 1.12 + 130)); d[i] = d[i + 1] = d[i + 2] = v; }
  px.putImageData(id, 0, 0);
  const fade = px.createLinearGradient(0, ph * .8, 0, ph); fade.addColorStop(0, "rgba(0,0,0,1)"); fade.addColorStop(1, "rgba(0,0,0,0)");
  px.globalCompositeOperation = "destination-in"; px.fillStyle = fade; px.fillRect(0, 0, pw, ph);
  x.drawImage(pc, W - pw - 30, 30);
  // logos
  x.drawImage(gcb, 60, 54, 229 * 130 / 360, 130); x.drawImage(jog, 60 + 229 * 130 / 360 + 18, 54, 181 * 130 / 176, 130);
  // title
  x.textBaseline = "alphabetic"; x.fillStyle = "#fff"; x.font = "700 150px Oswald, 'Arial Narrow', sans-serif";
  x.fillText(t("ig1").toUpperCase(), 52, 360);
  x.fillStyle = "#E08A3C"; x.font = "700 118px Oswald, 'Arial Narrow', sans-serif"; x.fillText(t("ig2").toUpperCase(), 56, 480);
  // events
  const up = EVENTS.filter(e => e.E >= TODAY && !isMissed(e)).slice(0, 4);
  let y = 560; const rowH = 150, gap = 22;
  for (const e of up) {
    const dateW = 250;
    x.fillStyle = "#D9D9D9"; x.fillRect(60, y, dateW, rowH);
    x.fillStyle = "#0D141B"; x.textAlign = "center"; x.font = "700 52px Oswald, 'Arial Narrow', sans-serif";
    const dr = igRange(e); x.fillText(fitText(x, dr, dateW - 24), 60 + dateW / 2, y + 74);
    x.font = "600 30px Oswald, 'Arial Narrow', sans-serif"; x.fillStyle = "#3B4652"; x.fillText(String(e.S.getUTCFullYear()), 60 + dateW / 2, y + 120);
    x.textAlign = "left";
    x.fillStyle = "rgba(11,18,26,.92)"; x.fillRect(60 + dateW + 14, y, W - 120 - dateW - 14, rowH);
    const tx = 60 + dateW + 40, tw = W - 60 - tx - 26;
    x.fillStyle = "#fff"; let fs = 46; x.font = `600 ${fs}px Oswald, 'Arial Narrow', sans-serif`;
    while (fs > 34 && x.measureText(e.t.toUpperCase()).width > tw) { fs -= 2; x.font = `600 ${fs}px Oswald, 'Arial Narrow', sans-serif`; }
    x.fillText(fitText(x, e.t.toUpperCase(), tw), tx, y + 66);
    x.fillStyle = "#E08A3C"; x.font = "600 38px Oswald, 'Arial Narrow', sans-serif";
    const pl = (placeText(e) || t("placeTBC")).toUpperCase();
    const plT = fitText(x, pl, tw - (isConf(e) ? 210 : 0)); x.fillText(plT, tx, y + 120);
    if (isConf(e)) { const w0 = x.measureText(plT).width + 22; x.font = "600 26px Oswald, 'Arial Narrow', sans-serif"; const lab = "✓ " + t("confirmed").toUpperCase(), lw = x.measureText(lab).width + 28;
      x.fillStyle = "#2E9A5B"; x.beginPath(); x.roundRect ? x.roundRect(tx + w0, y + 90, lw, 40, 20) : x.rect(tx + w0, y + 90, lw, 40); x.fill(); x.fillStyle = "#fff"; x.fillText(lab, tx + w0 + 14, y + 120); }
    y += rowH + gap;
  }
  // banner
  x.fillStyle = "#E08A3C"; x.fillRect(0, H - 96, W, 96);
  x.fillStyle = "#fff"; x.font = "600 42px Oswald, 'Arial Narrow', sans-serif"; x.textAlign = "left"; x.fillText("FORMANDO CONGO", 60, H - 32);
  x.textAlign = "right"; x.fillText("@CONGOCAPOEIRA", W - 60, H - 32); x.textAlign = "left";

}
let IG_BLOB = null;
async function openExport() {
  if (!CAN_EXPORT) return;
  const dlg = $("#sheet"); dlg.dataset.mode = "form"; dlg.dataset.id = "";
  dlg.style.setProperty("--c", "var(--orange)");
  $("#sh-tag").textContent = "Instagram · 1080 × 1350";
  $("#sh-title").textContent = t("igExport");
  $("#sh-when").textContent = t("igHint");
  $("#sh-body").innerHTML = `<p class="empty">…</p>`;
  if (!dlg.open) dlg.showModal();
  try {

    IG_BLOB = await new Promise(ok => c.toBlob(ok, "image/png"));
    $("#sh-body").innerHTML = `<img class="igprev" src="${c.toDataURL("image/png")}" alt="${esc(t("igExport"))}">
      <div class="actions">${DL ? `<button class="btn" data-ig-save="1">⬇ ${t("igSave")}</button>` : ""}</div>
      <p class="ferr" id="igerr" role="alert"></p>${DL ? "" : `<p class="foot">${t("igLongPress")}</p>`}`;
  } catch (err) { $("#sh-body").innerHTML = `<p class="ferr">${t("saveFail")}</p>`; }
}
async function saveExport(btn) {
  if (!DL || !IG_BLOB) return;
  btn.disabled = true;
  try { await DL.save({ filename: `congo-upcoming-${iso(TODAY)}.png`, data: IG_BLOB }); btn.textContent = "✓ " + t("igSaved"); }
  catch (e) { btn.disabled = false; if (e?.code !== "declined") $("#igerr").textContent = t("saveFail"); }
}
async function setType(id, type, btn) {
  const e = EVENTS.find(x => x.id === id); if (!DB || !e || !TYPE_C[type] || e.type === type) return;
  const before = e.type; e.type = type; refresh();
  try { await DB.collection("types").doc(id).set({ type, title: e.t, start: e.start, at: new Date().toISOString() }); }
  catch { e.type = before; refresh(); }
}
let busy = false;
// status: "going" (confirmed), "missed" (can't / couldn't make it) or "" (clear)
async function setStatus(id, status, btn) {
  if (!DB || busy) return;
  busy = true; btn.disabled = true;
  const e = EVENTS.find(x => x.id === id);
  try {
    const ref = DB.collection("confirmed").doc(id);
    if (status) await ref.set({ confirmed: status === "going", missed: status === "missed", title: e?.t || "", start: e?.start || "", at: new Date().toISOString() });
    else await ref.delete();
    status === "going" ? CONFIRMED.add(id) : CONFIRMED.delete(id);
    status === "missed" ? MISSED.add(id) : MISSED.delete(id);
  } catch { btn.textContent = t("saveFail"); busy = false; btn.disabled = false; return; }
  busy = false; refresh();
}
// ---- Reminder: past events (last 60 days) the owner hasn't marked as went / couldn't make it --------
var REMIND_SHOWN = false;
function toCheck() { return IS_OWNER && DB ? EVENTS.filter(e => e.E < TODAY && !e.pending && !CONFIRMED.has(e.id) && !MISSED.has(e.id) && (TODAY - e.E) <= 60 * 864e5).sort((a, b) => b.S - a.S) : []; }
function renderRemind() {
  const list = toCheck();
  $("#rm-title").textContent = t("remH"); $("#rm-sub").textContent = t("remSub");
  $("#rm-body").innerHTML = (list.length ? list.map(e => `<div class="rm-ev"><div><b>${esc(e.t)}</b><small>${fmtRange(e)}${e.cc ? ` · ${flag(e.cc)} ${esc(country(e.cc))}` : ""}</small></div>
    <div class="confbtns"><button class="btn" data-remset="going" data-rid="${e.id}">${t("remWent")}</button><button class="btn alt" data-remset="missed" data-rid="${e.id}">${t("remMiss")}</button></div></div>`).join("")
    : `<p class="hint">${t("remDone")}</p>`) + `<div class="rm-foot"><button class="btn alt" data-remlater>${t("remLater")}</button></div>`;
  return list.length;
}
function openRemind() { if (renderRemind() || $("#remind").open) { if (!$("#remind").open) $("#remind").showModal(); } }
function maybeRemind() {
  if (REMIND_SHOWN || !toCheck().length || $("#sheet").open) return;
  REMIND_SHOWN = true; openRemind();
}
$("#rm-x").onclick = () => $("#remind").close();
$("#remind").addEventListener("click", async ev => {
  if (ev.target.id === "remind" || ev.target.closest("[data-remlater]")) return $("#remind").close();
  const b = ev.target.closest("[data-remset]"); if (!b) return;
  await setStatus(b.dataset.rid, b.dataset.remset, b);
  renderRemind();
});
document.addEventListener("click", ev => { if (ev.target.closest?.("[data-remopen]")) openRemind(); });
