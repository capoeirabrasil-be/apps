<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Congo Capoeira Calendar · Formando Congo</title>
<meta name="description" content="Every roda, workshop, batizado and festival of Formando Congo in one app. Watch the 1-minute tutorial in English, Nederlands, Português, Français or Español.">
<meta property="og:type" content="website">
<meta property="og:title" content="Congo Capoeira Calendar">
<meta property="og:description" content="Every roda, workshop, batizado and festival of Formando Congo in one app. 1-minute video tutorial in 5 languages.">
<meta property="og:url" content="https://apps.capoeirabrasil.be/CongoCalender/info/">
<meta property="og:image" content="https://apps.capoeirabrasil.be/CongoCalender/info/og.jpg">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0B121A">
<link rel="icon" href="../img/favicon-64.png">
<link rel="apple-touch-icon" href="../img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { --bg: #0B121A; --panel: #121C26; --line: #22303D; --ink: #F3F5F7; --muted: #AEBBC8; --orange: #E08A3C; --display: "Oswald", "Arial Narrow", sans-serif; --body: "IBM Plex Sans", system-ui, sans-serif; }
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--body); -webkit-font-smoothing: antialiased; }
a { color: var(--orange); }
.wrap { width: min(1080px, 100%); margin: 0 auto; padding: 0 20px; }
header.hero { position: relative; overflow: hidden; background: radial-gradient(120% 90% at 20% 0%, rgba(7,11,16,0) 0%, rgba(7,11,16,.65) 70%), url(../img/bg-bokeh.webp) center / cover, var(--bg); padding: 18px 0 0; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.logos { display: flex; gap: 10px; align-items: center; }
.logos img { height: 52px; width: auto; }
.langs { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.langs button { border: 1px solid rgba(255,255,255,.18); background: rgba(0,0,0,.35); color: #fff; border-radius: 999px; padding: 6px 10px; font: 600 13px var(--body); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.langs button[aria-pressed="true"] { background: var(--orange); border-color: var(--orange); color: #1A1209; }
.herogrid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 28px; align-items: end; padding-top: 26px; }
h1 { font: 700 clamp(42px, 9vw, 84px)/.9 var(--display); text-transform: uppercase; margin: 0 0 16px; letter-spacing: .005em; }
h1 em { display: block; font-style: normal; color: var(--orange); }
.lead { font-size: clamp(17px, 2.3vw, 20px); color: #DCE3EA; max-width: 34em; margin: 0 0 22px; }
.ctas { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 30px; }
.btn { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 13px 20px; font: 600 15px var(--body); text-decoration: none; border: 0; cursor: pointer; }
.btn.main { background: var(--orange); color: #1A1209; }
.btn.alt { background: rgba(255,255,255,.08); color: #fff; border: 1px solid rgba(255,255,255,.2); }
.heroimg { justify-self: center; align-self: end; }
.heroimg img { display: block; width: min(280px, 70vw); height: auto; filter: drop-shadow(0 20px 40px rgba(0,0,0,.5)); }
.bar { background: var(--orange); color: #fff; font: 600 14px var(--display); text-transform: uppercase; letter-spacing: .05em; }
.bar .wrap { display: flex; justify-content: space-between; height: 32px; align-items: center; }
section { padding: 56px 0 8px; }
h2 { font: 600 clamp(26px, 4.5vw, 38px)/1.05 var(--display); text-transform: uppercase; margin: 0 0 10px; letter-spacing: .01em; }
h2 + p.sub { color: var(--muted); margin: 0 0 24px; max-width: 40em; }
.video { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 32px; align-items: center; }
.phone { position: relative; border-radius: 34px; padding: 10px; background: #05080C; border: 1px solid #2A3846; box-shadow: 0 30px 60px rgba(0,0,0,.45); }
.phone video { display: block; width: 100%; height: auto; border-radius: 26px; background: #000; aspect-ratio: 780 / 1328; }
.steps { list-style: none; margin: 0; padding: 0; counter-reset: s; display: grid; gap: 12px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: start; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.steps li::before { content: counter(s); display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--orange); color: #1A1209; font: 700 17px var(--display); }
.steps b { display: block; font-weight: 600; }
.steps span { color: var(--muted); font-size: 14.5px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; }
.card .shot { aspect-ratio: 390 / 420; overflow: hidden; background: #05080C; }
.card .shot img { display: block; width: 100%; height: auto; }
.card .txt { padding: 14px 16px 16px; }
.card h3 { margin: 0 0 4px; font: 600 19px var(--display); text-transform: uppercase; letter-spacing: .02em; }
.card p { margin: 0; color: var(--muted); font-size: 14.5px; }
.note { color: var(--muted); font-size: 13px; margin-top: 18px; }
footer { margin-top: 56px; padding: 26px 0 40px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
footer .wrap { display: flex; flex-wrap: wrap; gap: 10px 24px; justify-content: space-between; }
@media (max-width: 760px) {
  .herogrid, .video { grid-template-columns: 1fr; }
  .heroimg { display: none; }
  .logos img { height: 44px; }
  .phone { max-width: 340px; margin: 0 auto; }
  .langs button .nm { display: none; }
}
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <div class="top">
      <div class="logos"><img src="../img/gcb-formando-congo.webp" alt="Grupo Capoeira Brasil · Formando Congo"><img src="../img/jogando.webp" alt="Jogando Capoeira"></div>
      <div class="langs" id="langs" role="group" aria-label="Language"></div>
    </div>
    <div class="herogrid">
      <div>
        <h1>Congo Capoeira <em>Calendar</em></h1>
        <p class="lead" data-t="lead"></p>
        <div class="ctas"><a class="btn main" href="#video" data-t="watch"></a><a class="btn alt" href="../" data-t="open"></a></div>
      </div>
      <div class="heroimg"><img src="../img/congo.webp" alt="Formando Congo" width="537" height="820"></div>
    </div>
  </div>
  <div class="bar"><div class="wrap"><span>Formando Congo</span><span>@congocapoeira</span></div></div>
</header>

<main>
  <section id="video"><div class="wrap video">
    <div class="phone"><video id="vid" controls playsinline preload="metadata" poster="media/poster.jpg"></video></div>
    <div>
      <h2 data-t="vidH"></h2>
      <p class="sub" data-t="vidSub"></p>
      <h2 style="margin-top:30px" data-t="joinH"></h2>
      <ol class="steps" id="steps"></ol>
    </div>
  </div></section>

  <section><div class="wrap">
    <h2 data-t="featH"></h2>
    <p class="sub" data-t="featSub"></p>
    <div class="grid" id="grid"></div>
    <p class="note" data-t="demo"></p>
  </div></section>
</main>

<footer><div class="wrap"><span>Congo Capoeira Calendar · Grupo Capoeira Brasil · Formando Congo</span><a href="https://www.instagram.com/congocapoeira/" target="_blank" rel="noopener">Instagram @congocapoeira</a></div></footer>

<script>
const LANGS = [["en", "🇬🇧", "English"], ["nl", "🇳🇱", "Nederlands"], ["pt", "🇧🇷", "Português"], ["fr", "🇫🇷", "Français"], ["es", "🇪🇸", "Español"]];
const SHOTS = ["upcoming", "event", "going", "car", "agenda", "analytics", "settings", "howto"];
const T = {
en: { lead: "Every roda, workshop, batizado and festival of Formando Congo in one app on your phone. See what's coming, say you're going, and find a seat in a car.", watch: "▶ Watch the 1-minute tutorial", open: "Open the calendar", vidH: "How it works", vidSub: "A short tour with voice-over. Subtitles are on; switch the language at the top.",
  joinH: "How to join", steps: [["Ask for an invite", "Send a message to Formando Congo, on Instagram @congocapoeira or in person, with your Google (Gmail) address."], ["Open the link on your phone", "Use Safari or Chrome, not the browser inside WhatsApp or Instagram."], ["Sign in with Google", "Use the same Google account your invite was sent to."], ["Put it on your home screen", "iPhone: Share → Add to Home Screen. Android: menu ⋮ → Add to home screen. It then opens like an app."]],
  featH: "What you can do", featSub: "Everything in English, Nederlands, Português, Français and Español.",
  f: [["Upcoming", "The next events with a countdown, right when you open the app."], ["Event details", "Date, place, programme and a button to add it to your own calendar or open it in Maps. Descriptions are translated into your language."], ["I'm going", "Tap “I'm going” and the event lights up in orange everywhere in the app."], ["Car seats", "When an organiser drives, reserve a free seat and see where and when the car leaves. First come, first served."], ["Agenda", "Everything as a list, a month or a whole year, with filters per type of event."], ["Analytics", "How many events per year and type, and every city on the map."], ["Your profile", "Add your capoeira name, and choose your language and light or dark mode."], ["How to", "A built-in guide that grows with every new feature."]],
  demo: "The video and pictures use example events, not the real calendar." },
nl: { lead: "Elke roda, workshop, batizado en elk festival van Formando Congo in één app op je telefoon. Zie wat er komt, laat weten dat je meegaat en vind een plaats in een auto.", watch: "▶ Bekijk de uitleg van 1 minuut", open: "Open de kalender", vidH: "Zo werkt het", vidSub: "Een korte rondleiding met gesproken uitleg. Ondertitels staan aan; kies bovenaan je taal.",
  joinH: "Zo doe je mee", steps: [["Vraag een uitnodiging", "Stuur Formando Congo een bericht, op Instagram @congocapoeira of persoonlijk, met je Google-adres (Gmail)."], ["Open de link op je telefoon", "Gebruik Safari of Chrome, niet de browser in WhatsApp of Instagram."], ["Meld je aan met Google", "Met hetzelfde Google-account waarnaar je uitnodiging werd gestuurd."], ["Zet de app op je beginscherm", "iPhone: Deel → Zet op beginscherm. Android: menu ⋮ → Toevoegen aan startscherm. Dan opent hij als een app."]],
  featH: "Wat je kunt doen", featSub: "Alles in het English, Nederlands, Português, Français en Español.",
  f: [["Binnenkort", "De volgende events met een aftelling, meteen als je de app opent."], ["Details van een event", "Datum, plaats, programma en een knop om het in je eigen agenda te zetten of in Kaarten te openen. Beschrijvingen worden vertaald naar jouw taal."], ["Ik ga", "Tik op “Ik ga” en het event licht overal in de app oranje op."], ["Plaatsen in de auto", "Als een organisator rijdt, reserveer je een vrije plaats en zie je waar en wanneer de auto vertrekt. Wie eerst komt, eerst maalt."], ["Agenda", "Alles als lijst, per maand of per jaar, met filters per soort event."], ["Statistieken", "Hoeveel events per jaar en per soort, en elke stad op de kaart."], ["Je profiel", "Vul je capoeiranaam in en kies je taal en een lichte of donkere weergave."], ["Uitleg", "Een ingebouwde handleiding die groeit met elke nieuwe functie."]],
  demo: "De video en afbeeldingen tonen voorbeeld-events, niet de echte kalender." },
pt: { lead: "Todas as rodas, workshops, batizados e festivais do Formando Congo num só app no seu celular. Veja o que vem por aí, diga que vai e encontre um lugar num carro.", watch: "▶ Veja o tutorial de 1 minuto", open: "Abrir o calendário", vidH: "Como funciona", vidSub: "Um tour curto com narração. As legendas estão ligadas; mude a língua lá em cima.",
  joinH: "Como participar", steps: [["Peça um convite", "Mande uma mensagem ao Formando Congo, no Instagram @congocapoeira ou pessoalmente, com seu endereço Google (Gmail)."], ["Abra o link no celular", "Use o Safari ou o Chrome, não o navegador dentro do WhatsApp ou do Instagram."], ["Entre com Google", "Use a mesma conta Google para a qual o convite foi enviado."], ["Coloque na tela inicial", "iPhone: Compartilhar → Adicionar à Tela de Início. Android: menu ⋮ → Adicionar à tela inicial. Assim ele abre como um app."]],
  featH: "O que você pode fazer", featSub: "Tudo em English, Nederlands, Português, Français e Español.",
  f: [["Próximos", "Os próximos eventos com contagem regressiva, assim que você abre o app."], ["Detalhes do evento", "Data, local, programa e um botão para adicionar à sua agenda ou abrir no Maps. As descrições são traduzidas para a sua língua."], ["Eu vou", "Toque em “Eu vou” e o evento fica destacado em laranja em todo o app."], ["Lugares no carro", "Quando um organizador vai de carro, reserve um lugar livre e veja de onde e quando o carro sai. Por ordem de chegada."], ["Agenda", "Tudo em lista, por mês ou pelo ano inteiro, com filtros por tipo de evento."], ["Estatísticas", "Quantos eventos por ano e tipo, e cada cidade no mapa."], ["Seu perfil", "Coloque seu nome de capoeira, e escolha a língua e o modo claro ou escuro."], ["Ajuda", "Um guia dentro do app que cresce a cada nova função."]],
  demo: "O vídeo e as imagens mostram eventos de exemplo, não o calendário real." },
fr: { lead: "Chaque roda, workshop, batizado et festival de Formando Congo dans une seule app sur votre téléphone. Voyez ce qui arrive, dites que vous venez et trouvez une place en voiture.", watch: "▶ Voir le tutoriel d'1 minute", open: "Ouvrir le calendrier", vidH: "Comment ça marche", vidSub: "Une courte visite commentée. Les sous-titres sont activés ; changez de langue en haut.",
  joinH: "Comment rejoindre", steps: [["Demandez une invitation", "Envoyez un message à Formando Congo, sur Instagram @congocapoeira ou en personne, avec votre adresse Google (Gmail)."], ["Ouvrez le lien sur votre téléphone", "Utilisez Safari ou Chrome, pas le navigateur intégré de WhatsApp ou Instagram."], ["Connectez-vous avec Google", "Avec le compte Google qui a reçu l'invitation."], ["Ajoutez-la à l'écran d'accueil", "iPhone : Partager → Sur l'écran d'accueil. Android : menu ⋮ → Ajouter à l'écran d'accueil. Elle s'ouvre alors comme une app."]],
  featH: "Ce que vous pouvez faire", featSub: "Tout en English, Nederlands, Português, Français et Español.",
  f: [["À venir", "Les prochains événements avec un compte à rebours, dès l'ouverture de l'app."], ["Détails d'un événement", "Date, lieu, programme et un bouton pour l'ajouter à votre agenda ou l'ouvrir dans Maps. Les descriptions sont traduites dans votre langue."], ["J'y vais", "Touchez « J'y vais » et l'événement s'allume en orange partout dans l'app."], ["Places en voiture", "Quand un organisateur conduit, réservez une place libre et voyez d'où et quand la voiture part. Premier arrivé, premier servi."], ["Agenda", "Tout en liste, par mois ou sur l'année, avec des filtres par type d'événement."], ["Statistiques", "Le nombre d'événements par année et par type, et chaque ville sur la carte."], ["Votre profil", "Ajoutez votre nom de capoeira, et choisissez la langue et le mode clair ou sombre."], ["Aide", "Un guide intégré qui grandit avec chaque nouvelle fonction."]],
  demo: "La vidéo et les images montrent des événements d'exemple, pas le vrai calendrier." },
es: { lead: "Cada roda, taller, batizado y festival de Formando Congo en una sola app en tu móvil. Mira lo que viene, di que vas y encuentra plaza en un coche.", watch: "▶ Mira el tutorial de 1 minuto", open: "Abrir el calendario", vidH: "Cómo funciona", vidSub: "Un recorrido corto con narración. Los subtítulos están activados; cambia el idioma arriba.",
  joinH: "Cómo unirte", steps: [["Pide una invitación", "Escribe a Formando Congo, en Instagram @congocapoeira o en persona, con tu dirección de Google (Gmail)."], ["Abre el enlace en tu móvil", "Usa Safari o Chrome, no el navegador dentro de WhatsApp o Instagram."], ["Entra con Google", "Con la misma cuenta de Google a la que se envió la invitación."], ["Ponla en la pantalla de inicio", "iPhone: Compartir → Añadir a pantalla de inicio. Android: menú ⋮ → Añadir a pantalla de inicio. Así se abre como una app."]],
  featH: "Qué puedes hacer", featSub: "Todo en English, Nederlands, Português, Français y Español.",
  f: [["Próximos", "Los próximos eventos con cuenta atrás, nada más abrir la app."], ["Detalles del evento", "Fecha, lugar, programa y un botón para añadirlo a tu calendario o abrirlo en Mapas. Las descripciones se traducen a tu idioma."], ["Voy", "Toca “Voy” y el evento se ilumina en naranja en toda la app."], ["Plazas en coche", "Cuando un organizador va en coche, reserva una plaza libre y mira desde dónde y cuándo sale. Por orden de llegada."], ["Agenda", "Todo en lista, por mes o por año, con filtros por tipo de evento."], ["Estadísticas", "Cuántos eventos por año y tipo, y cada ciudad en el mapa."], ["Tu perfil", "Añade tu nombre de capoeira, y elige el idioma y el modo claro u oscuro."], ["Ayuda", "Una guía dentro de la app que crece con cada nueva función."]],
  demo: "El vídeo y las imágenes muestran eventos de ejemplo, no el calendario real." }
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let L = (() => { const q = new URLSearchParams(location.search).get("lang"); if (T[q]) return q; try { const s = localStorage.getItem("ccc.lang"); if (T[s]) return s; } catch {} const n = (navigator.language || "en").slice(0, 2).toLowerCase(); return T[n] ? n : "en"; })();
const vid = document.getElementById("vid");
function setLang(l, user) {
  L = l; const d = T[l]; document.documentElement.lang = l;
  if (user) { try { localStorage.setItem("ccc.lang", l); } catch {} }
  document.getElementById("langs").innerHTML = LANGS.map(([k, fl, nm]) => `<button type="button" data-l="${k}" aria-pressed="${k === l}" lang="${k}"><span>${fl}</span><span class="nm">${nm}</span></button>`).join("");
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = d[el.dataset.t]);
  document.getElementById("steps").innerHTML = d.steps.map(([b, s]) => `<li><div><b>${esc(b)}</b><span>${esc(s)}</span></div></li>`).join("");
  document.getElementById("grid").innerHTML = d.f.map(([h, p], i) => `<article class="card"><div class="shot"><img loading="lazy" src="shots/${l}-${SHOTS[i]}.webp" alt="${esc(h)}" width="390" height="664"></div><div class="txt"><h3>${esc(h)}</h3><p>${esc(p)}</p></div></article>`).join("");
  const playing = !vid.paused; const t = vid.currentTime;
  vid.innerHTML = `<source src="media/tutorial-${l}.mp4" type="video/mp4"><track kind="subtitles" srclang="${l}" label="${LANGS.find(x => x[0] === l)[2]}" src="media/tutorial-${l}.vtt" default>`;
  vid.load(); if (playing) { vid.currentTime = 0; vid.play().catch(() => {}); } else if (t) vid.currentTime = 0;
  vid.addEventListener("loadedmetadata", () => { for (const tr of vid.textTracks) tr.mode = "showing"; }, { once: true });
  const u = new URL(location.href); u.searchParams.set("lang", l); history.replaceState(null, "", u);
}
document.getElementById("langs").addEventListener("click", e => { const b = e.target.closest("[data-l]"); if (b) setLang(b.dataset.l, true); });
setLang(L, false);
</script>
</body>
</html>
