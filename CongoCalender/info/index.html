<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Congo Capoeira Calendar · Formando Congo</title>
<meta name="description" content="Every roda, workshop, batizado and festival of Formando Congo in one app. Watch the video tours, one per tab, in English, Nederlands, Português, Français or Español.">
<meta property="og:type" content="website">
<meta property="og:title" content="Congo Capoeira Calendar">
<meta property="og:description" content="Every roda, workshop, batizado and festival of Formando Congo in one app. Video tours per tab in 5 languages.">
<meta property="og:url" content="https://apps.capoeirabrasil.be/CongoCalender/info/">
<meta property="og:image" content="https://apps.capoeirabrasil.be/CongoCalender/info/og.jpg">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0B121A">
<link rel="icon" href="../img/favicon-64.png">
<link rel="apple-touch-icon" href="../img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { --bg: #0B121A; --panel: #121C26; --line: #22303D; --ink: #F3F5F7; --muted: #AEBBC8; --orange: #E08A3C; --display: "Oswald", "Arial Narrow", sans-serif; --body: "IBM Plex Sans", system-ui, sans-serif; }
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--body); -webkit-font-smoothing: antialiased; }
a { color: var(--orange); }
.wrap { width: min(1080px, 100%); margin: 0 auto; padding: 0 20px; }
header.hero { position: relative; overflow: hidden; background: radial-gradient(120% 90% at 20% 0%, rgba(7,11,16,0) 0%, rgba(7,11,16,.65) 70%), url(../img/bg-bokeh.webp) center / cover, var(--bg); padding: 18px 0 0; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.logos { display: flex; gap: 10px; align-items: center; }
.logos img { height: 52px; width: auto; }
.langs { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.langs button { border: 1px solid rgba(255,255,255,.18); background: rgba(0,0,0,.35); color: #fff; border-radius: 999px; padding: 6px 10px; font: 600 13px var(--body); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.langs button[aria-pressed="true"] { background: var(--orange); border-color: var(--orange); color: #1A1209; }
.herogrid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 28px; align-items: end; padding-top: 26px; }
h1 { font: 700 clamp(42px, 9vw, 84px)/.9 var(--display); text-transform: uppercase; margin: 0 0 16px; letter-spacing: .005em; }
h1 em { display: block; font-style: normal; color: var(--orange); }
.lead { font-size: clamp(17px, 2.3vw, 20px); color: #DCE3EA; max-width: 34em; margin: 0 0 22px; }
.ctas { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 30px; }
.btn { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 13px 20px; font: 600 15px var(--body); text-decoration: none; border: 0; cursor: pointer; }
.btn.main { background: var(--orange); color: #1A1209; }
.btn.alt { background: rgba(255,255,255,.08); color: #fff; border: 1px solid rgba(255,255,255,.2); }
.heroimg { justify-self: center; align-self: end; }
.heroimg img { display: block; width: min(280px, 70vw); height: auto; filter: drop-shadow(0 20px 40px rgba(0,0,0,.5)); }
.bar { background: var(--orange); color: #fff; font: 600 14px var(--display); text-transform: uppercase; letter-spacing: .05em; }
.bar .wrap { display: flex; justify-content: space-between; height: 32px; align-items: center; }
section { padding: 56px 0 8px; }
h2 { font: 600 clamp(26px, 4.5vw, 38px)/1.05 var(--display); text-transform: uppercase; margin: 0 0 10px; letter-spacing: .01em; }
h2 + p.sub { color: var(--muted); margin: 0 0 24px; max-width: 40em; }
.video { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 32px; align-items: center; }
.phone { position: relative; border-radius: 34px; padding: 10px; background: #05080C; border: 1px solid #2A3846; box-shadow: 0 30px 60px rgba(0,0,0,.45); }
.phone video { display: block; width: 100%; height: auto; border-radius: 26px; background: #000; aspect-ratio: 780 / 1328; }
.tours { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 22px; }
.tours button { font: 600 14px var(--body); color: #fff; background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; cursor: pointer; }
.tours button[aria-selected="true"] { background: var(--orange); color: #1A1209; border-color: var(--orange); }
.tourdesc { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--orange); border-radius: 12px; padding: 12px 14px; margin: 0 0 6px; }
.tourdesc b { display: block; font: 600 18px var(--display); text-transform: uppercase; letter-spacing: .02em; }
.steps { list-style: none; margin: 0; padding: 0; counter-reset: s; display: grid; gap: 12px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: start; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.steps li::before { content: counter(s); display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--orange); color: #1A1209; font: 700 17px var(--display); }
.steps b { display: block; font-weight: 600; }
.steps span { color: var(--muted); font-size: 14.5px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; }
.card .shot { aspect-ratio: 390 / 420; overflow: hidden; background: #05080C; }
.card .shot img { display: block; width: 100%; height: auto; }
.card .txt { padding: 14px 16px 16px; }
.card h3 { margin: 0 0 4px; font: 600 19px var(--display); text-transform: uppercase; letter-spacing: .02em; }
.card p { margin: 0; color: var(--muted); font-size: 14.5px; }
.note { color: var(--muted); font-size: 13px; margin-top: 18px; }
footer { margin-top: 56px; padding: 26px 0 40px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
footer .wrap { display: flex; flex-wrap: wrap; gap: 10px 24px; justify-content: space-between; }
@media (max-width: 760px) {
  .herogrid, .video { grid-template-columns: 1fr; }
  .heroimg { display: none; }
  .logos img { height: 44px; }
  .phone { max-width: 340px; margin: 0 auto; }
  .langs button .nm { display: none; }
}
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <div class="top">
      <div class="logos"><img src="../img/gcb-formando-congo.webp" alt="Grupo Capoeira Brasil · Formando Congo"><img src="../img/jogando.webp" alt="Jogando Capoeira"></div>
      <div class="langs" id="langs" role="group" aria-label="Language"></div>
    </div>
    <div class="herogrid">
      <div>
        <h1>Congo Capoeira <em>Calendar</em></h1>
        <p class="lead" data-t="lead"></p>
        <div class="ctas"><a class="btn main" href="#video" data-t="watch"></a><a class="btn alt" href="../" data-t="open"></a></div>
      </div>
      <div class="heroimg"><img src="../img/congo.webp" alt="Formando Congo" width="537" height="820"></div>
    </div>
  </div>
  <div class="bar"><div class="wrap"><span>Formando Congo</span><span>@congocapoeira</span></div></div>
</header>

<main>
  <section id="video"><div class="wrap"><div class="tours" id="tours" role="tablist"></div></div><div class="wrap video">
    <div class="phone"><video id="vid" controls playsinline preload="metadata" poster="media/poster.jpg"></video></div>
    <div>
      <h2 data-t="vidH"></h2>
      <p class="sub" data-t="vidSub"></p>
      <p class="tourdesc" id="tourdesc"></p>
      <h2 style="margin-top:30px" data-t="joinH"></h2>
      <ol class="steps" id="steps"></ol>
    </div>
  </div></section>

  <section><div class="wrap">
    <h2 data-t="featH"></h2>
    <p class="sub" data-t="featSub"></p>
    <div class="grid" id="grid"></div>
    <p class="note" data-t="demo"></p>
  </div></section>
</main>

<footer><div class="wrap"><span>Congo Capoeira Calendar · Grupo Capoeira Brasil · Formando Congo</span><a href="https://www.instagram.com/congocapoeira/" target="_blank" rel="noopener">Instagram @congocapoeira</a></div></footer>

<script>
const LANGS = [["en", "🇬🇧", "English"], ["nl", "🇳🇱", "Nederlands"], ["pt", "🇧🇷", "Português"], ["fr", "🇫🇷", "Français"], ["es", "🇪🇸", "Español"], ["pl", "🇵🇱", "Polski"], ["uk", "🇺🇦", "Українська"], ["de", "🇩🇪", "Deutsch"]];
const SHOTS = ["upcoming", "event", "going", "car", "agenda", "analytics", "settings", "howto", "suggest"];
const T = {
en: { lead: "Every roda, workshop, batizado and festival of Formando Congo in one app on your phone. See what's coming, say you're going, and find a seat in a car.", watch: "▶ Watch the video tours", open: "Open the calendar", vidH: "How it works", vidSub: "Start with the 1-minute overview, then pick a tab for a closer look. Voice-over and subtitles in your language; switch it at the top.", tours: [["Overview", "The whole app in one minute."], ["Upcoming & events", "The next events, event details, weather, flyers, translations, “I'm going” and car seats."], ["Agenda", "List, month and year views, and filters per type of event."], ["Analytics", "Where Congo went: totals, charts and the map."], ["How to & ideas", "The built-in guide, and how to suggest a feature or report a bug and follow it."], ["Settings", "Look, your profile, available offline (opens at once, updates in the background), the app on your phone, language and signing out."], ["For administrators", "Confirming events and your role, car seats, the Joining tab, how Congo took part in Analytics, and the Admin tab with notifications (also as phone pop-ups), the public calendar check, invites, last online, bug reports, feature suggestions and your own feature form."]],
  joinH: "How to join", steps: [["Ask for an invite", "Send a message to Formando Congo, on Instagram @congocapoeira or in person, with your Google (Gmail) address. Or open the app, sign in with Google and tap “Request access”: Formando Congo sees your request and can accept it."], ["Open the link on your phone", "Use Safari or Chrome, not the browser inside WhatsApp or Instagram."], ["Sign in with Google", "Use the same Google account your invite was sent to."], ["Put it on your home screen", "iPhone: Share → Add to Home Screen. Android: menu ⋮ → Add to home screen. It then opens like an app."]],
  featH: "What you can do", featSub: "Everything in English, Nederlands, Português, Français, Español, Polski, Українська and Deutsch.",
  f: [["Upcoming", "The next events with a countdown, right when you open the app."], ["Event details", "Date, place, programme and a button to add it to your own calendar or open it in Maps. Descriptions are translated into your language, flyers and Instagram posts show right in the description, and from 5 days before you see the weather forecast."], ["I'm going", "Tap “I'm going” and the event lights up in orange everywhere in the app."], ["Car seats", "When an administrator drives, reserve a free seat and see where and when the car leaves. First come, first served."], ["Agenda", "Everything as a list, a month or a whole year, with filters per type of event."], ["Analytics", "How many events per year and type, how many at home (Belgium), in Europe and in the Americas, and every city on the map."], ["Your profile", "Add your capoeira name, choose your language and light or dark mode, and keep the calendar available offline on your phone: it opens at once and updates in the background, and a green, red or orange light shows online, offline or updating."], ["How to", "A built-in guide that grows with every new feature."], ["Chat per event", "Going to an event? Open it and chat with the others who are going: who drives, what to bring. You can also write privately with the administrators about that event. Chats are removed 2 weeks after the event."], ["Phone notifications", "Switch on notifications in Settings (tap 🔔 and allow). Administrators can then send you a message that shows as a pop-up in the app and as a phone notification, for example about an event you are going to. You can switch it off again at any time. On an iPhone, open the app from your home screen first."], ["Suggest a feature", "Missing something, or found a bug? Send it from the How to tab and follow its status. Approved ideas get built into the app."]],
  demo: "The video and pictures use example events, not the real calendar." },
nl: { lead: "Elke roda, workshop, batizado en elk festival van Formando Congo in één app op je telefoon. Zie wat er komt, laat weten dat je meegaat en vind een plaats in een auto.", watch: "▶ Bekijk de video-uitleg", open: "Open de kalender", vidH: "Zo werkt het", vidSub: "Begin met het overzicht van 1 minuut en kies dan een tabblad voor meer uitleg. Gesproken uitleg en ondertitels in jouw taal; kies die bovenaan.", tours: [["Overzicht", "De hele app in één minuut."], ["Binnenkort & events", "De volgende events, details, weer, flyers, vertalingen, “Ik ga” en plaatsen in de auto."], ["Agenda", "Lijst, maand en jaar, en filters per soort event."], ["Statistieken", "Waar Congo was: totalen, grafieken en de kaart."], ["Uitleg & ideeën", "De ingebouwde handleiding, en hoe je een functie voorstelt of een fout meldt en opvolgt."], ["Instellingen", "Weergave, je profiel, offline beschikbaar (opent meteen, werkt op de achtergrond bij), de app op je telefoon, taal en afmelden."], ["Voor beheerders", "Events en je rol bevestigen, plaatsen in de auto, Wie gaat, hoe Congo meedeed in Statistieken, en het tabblad Admin met meldingen (ook als pop-up op je telefoon), de controle van de publieke agenda, uitnodigen, laatst online, foutmeldingen, functievoorstellen en je eigen functieformulier."]],
  joinH: "Zo doe je mee", steps: [["Vraag een uitnodiging", "Stuur Formando Congo een bericht, op Instagram @congocapoeira of persoonlijk, met je Google-adres (Gmail). Of open de app, log in met Google en tik op “Toegang aanvragen”: Formando Congo ziet je aanvraag en kan die accepteren."], ["Open de link op je telefoon", "Gebruik Safari of Chrome, niet de browser in WhatsApp of Instagram."], ["Meld je aan met Google", "Met hetzelfde Google-account waarnaar je uitnodiging werd gestuurd."], ["Zet de app op je beginscherm", "iPhone: Deel → Zet op beginscherm. Android: menu ⋮ → Toevoegen aan startscherm. Dan opent hij als een app."]],
  featH: "Wat je kunt doen", featSub: "Alles in het English, Nederlands, Português, Français, Español, Polski, Українська en Deutsch.",
  f: [["Binnenkort", "De volgende events met een aftelling, meteen als je de app opent."], ["Details van een event", "Datum, plaats, programma en een knop om het in je eigen agenda te zetten of in Kaarten te openen. Beschrijvingen worden vertaald naar jouw taal, flyers en Instagram-posts verschijnen meteen in de beschrijving, en vanaf 5 dagen ervoor zie je de weersverwachting."], ["Ik ga", "Tik op “Ik ga” en het event licht overal in de app oranje op."], ["Plaatsen in de auto", "Als een beheerder rijdt, reserveer je een vrije plaats en zie je waar en wanneer de auto vertrekt. Wie eerst komt, eerst maalt."], ["Agenda", "Alles als lijst, per maand of per jaar, met filters per soort event."], ["Statistieken", "Hoeveel events per jaar en per soort, hoeveel thuis (België), in Europa en in Amerika, en elke stad op de kaart."], ["Je profiel", "Vul je capoeiranaam in, kies je taal en een lichte of donkere weergave, en bewaar de kalender offline op je telefoon: hij opent meteen en werkt op de achtergrond bij, en een groen, rood of oranje lichtje toont online, offline of bijwerken."], ["Uitleg", "Een ingebouwde handleiding die groeit met elke nieuwe functie."], ["Chat per event", "Ga je naar een event? Open het en chat met de anderen die gaan: wie rijdt, wat meenemen. Je kunt ook privé met de beheerders over dat event schrijven. Chats verdwijnen 2 weken na het event."], ["Meldingen op je telefoon", "Zet meldingen aan in Instellingen (tik op 🔔 en sta toe). Beheerders kunnen je dan een bericht sturen dat als pop-up in de app en als melding op je telefoon verschijnt, bijvoorbeeld over een event waar je naartoe gaat. Je kunt het altijd weer uitzetten. Op een iPhone open je de app eerst vanaf je beginscherm."], ["Stel een functie voor", "Mis je iets, of vond je een fout? Stuur het via het tabblad Uitleg en volg de status. Goedgekeurde ideeën worden in de app gebouwd."]],
  demo: "De video en afbeeldingen tonen voorbeeld-events, niet de echte kalender." },
pt: { lead: "Todas as rodas, workshops, batizados e festivais do Formando Congo num só app no seu celular. Veja o que vem por aí, diga que vai e encontre um lugar num carro.", watch: "▶ Veja os vídeos explicativos", open: "Abrir o calendário", vidH: "Como funciona", vidSub: "Comece pelo resumo de 1 minuto e depois escolha uma aba para ver em detalhe. Narração e legendas na sua língua; mude lá em cima.", tours: [["Resumo", "O app inteiro em um minuto."], ["Próximos & eventos", "Os próximos eventos, detalhes, tempo, flyers, traduções, “Eu vou” e lugares no carro."], ["Agenda", "Lista, mês e ano, e filtros por tipo de evento."], ["Estatísticas", "Onde o Congo esteve: totais, gráficos e o mapa."], ["Ajuda & ideias", "O guia do app, e como sugerir uma função ou relatar um erro e acompanhar."], ["Ajustes", "Aparência, seu perfil, disponível offline (abre logo, atualiza em segundo plano), o app no celular, língua e sair."], ["Para administradores", "Confirmar eventos e o seu papel, lugares no carro, a aba Quem vai, como o Congo participou nas Estatísticas, e a aba Admin com notificações (também como aviso no celular), a verificação do calendário público, convites, último acesso, relatos de erro, sugestões de funções e o seu próprio formulário de funções."]],
  joinH: "Como participar", steps: [["Peça um convite", "Mande uma mensagem ao Formando Congo, no Instagram @congocapoeira ou pessoalmente, com seu endereço Google (Gmail). Ou abra o app, entre com o Google e toque em “Pedir acesso”: o Formando Congo vê o pedido e pode aceitar."], ["Abra o link no celular", "Use o Safari ou o Chrome, não o navegador dentro do WhatsApp ou do Instagram."], ["Entre com Google", "Use a mesma conta Google para a qual o convite foi enviado."], ["Coloque na tela inicial", "iPhone: Compartilhar → Adicionar à Tela de Início. Android: menu ⋮ → Adicionar à tela inicial. Assim ele abre como um app."]],
  featH: "O que você pode fazer", featSub: "Tudo em English, Nederlands, Português, Français, Español, Polski, Українська e Deutsch.",
  f: [["Próximos", "Os próximos eventos com contagem regressiva, assim que você abre o app."], ["Detalhes do evento", "Data, local, programa e um botão para adicionar à sua agenda ou abrir no Maps. As descrições são traduzidas para a sua língua, flyers e posts do Instagram aparecem na própria descrição, e a partir de 5 dias antes você vê a previsão do tempo."], ["Eu vou", "Toque em “Eu vou” e o evento fica destacado em laranja em todo o app."], ["Lugares no carro", "Quando um administrador vai de carro, reserve um lugar livre e veja de onde e quando o carro sai. Por ordem de chegada."], ["Agenda", "Tudo em lista, por mês ou pelo ano inteiro, com filtros por tipo de evento."], ["Estatísticas", "Quantos eventos por ano e tipo, quantos em casa (Bélgica), na Europa e nas Américas, e cada cidade no mapa."], ["Seu perfil", "Coloque seu nome de capoeira, escolha a língua e o modo claro ou escuro, e guarde o calendário offline no celular: ele abre logo e atualiza em segundo plano, e uma luz verde, vermelha ou laranja mostra online, offline ou atualizando."], ["Ajuda", "Um guia dentro do app que cresce a cada nova função."], ["Chat por evento", "Vai a um evento? Abra-o e converse com os outros que vão: quem leva carro, o que levar. Você também pode escrever em privado com os administradores sobre esse evento. Os chats são apagados 2 semanas depois do evento."], ["Notificações no celular", "Ative as notificações em Ajustes (toque em 🔔 e permita). Os administradores podem então enviar uma mensagem que aparece como pop-up no app e como notificação no celular. Você pode desativar quando quiser. No iPhone, abra primeiro o app pela tela de início."], ["Sugira uma função", "Falta algo, ou encontrou um erro? Envie pela aba Ajuda e acompanhe o estado. As ideias aprovadas entram no app."]],
  demo: "O vídeo e as imagens mostram eventos de exemplo, não o calendário real." },
fr: { lead: "Chaque roda, workshop, batizado et festival de Formando Congo dans une seule app sur votre téléphone. Voyez ce qui arrive, dites que vous venez et trouvez une place en voiture.", watch: "▶ Voir les visites vidéo", open: "Ouvrir le calendrier", vidH: "Comment ça marche", vidSub: "Commencez par l'aperçu d'1 minute, puis choisissez un onglet pour en savoir plus. Voix et sous-titres dans votre langue ; changez-la en haut.", tours: [["Aperçu", "Toute l'app en une minute."], ["À venir & événements", "Les prochains événements, les détails, la météo, les flyers, les traductions, « J'y vais » et les places en voiture."], ["Agenda", "Liste, mois et année, et filtres par type d'événement."], ["Statistiques", "Où Congo est allé : totaux, graphiques et la carte."], ["Aide & idées", "Le guide intégré, et comment proposer une fonction ou signaler un bug et le suivre."], ["Réglages", "Apparence, votre profil, disponible hors ligne (s'ouvre tout de suite, se met à jour en arrière-plan), l'app sur votre téléphone, la langue et la déconnexion."], ["Pour les administrateurs", "Confirmer les événements et votre rôle, places en voiture, l'onglet Qui vient, la participation de Congo dans Statistiques, et l'onglet Admin avec notifications (aussi en alerte sur le téléphone), la vérification de l'agenda public, invitations, dernière connexion, signalements de bugs, propositions de fonctions et votre propre formulaire de fonctions."]],
  joinH: "Comment rejoindre", steps: [["Demandez une invitation", "Envoyez un message à Formando Congo, sur Instagram @congocapoeira ou en personne, avec votre adresse Google (Gmail). Ou ouvrez l'appli, connectez-vous avec Google et touchez « Demander l'accès » : Formando Congo voit votre demande et peut l'accepter."], ["Ouvrez le lien sur votre téléphone", "Utilisez Safari ou Chrome, pas le navigateur intégré de WhatsApp ou Instagram."], ["Connectez-vous avec Google", "Avec le compte Google qui a reçu l'invitation."], ["Ajoutez-la à l'écran d'accueil", "iPhone : Partager → Sur l'écran d'accueil. Android : menu ⋮ → Ajouter à l'écran d'accueil. Elle s'ouvre alors comme une app."]],
  featH: "Ce que vous pouvez faire", featSub: "Tout en English, Nederlands, Português, Français, Español, Polski, Українська et Deutsch.",
  f: [["À venir", "Les prochains événements avec un compte à rebours, dès l'ouverture de l'app."], ["Détails d'un événement", "Date, lieu, programme et un bouton pour l'ajouter à votre agenda ou l'ouvrir dans Maps. Les descriptions sont traduites dans votre langue, les flyers et posts Instagram s'affichent directement dans la description, et dès 5 jours avant vous voyez la météo prévue."], ["J'y vais", "Touchez « J'y vais » et l'événement s'allume en orange partout dans l'app."], ["Places en voiture", "Quand un administrateur conduit, réservez une place libre et voyez d'où et quand la voiture part. Premier arrivé, premier servi."], ["Agenda", "Tout en liste, par mois ou sur l'année, avec des filtres par type d'événement."], ["Statistiques", "Le nombre d'événements par année et par type, combien chez nous (Belgique), en Europe et en Amérique, et chaque ville sur la carte."], ["Votre profil", "Ajoutez votre nom de capoeira, choisissez la langue et le mode clair ou sombre, et gardez le calendrier hors ligne sur votre téléphone : il s'ouvre tout de suite et se met à jour en arrière-plan, et un voyant vert, rouge ou orange indique en ligne, hors ligne ou mise à jour."], ["Aide", "Un guide intégré qui grandit avec chaque nouvelle fonction."], ["Chat par événement", "Vous allez à un événement ? Ouvrez-le et discutez avec les autres participants : qui conduit, quoi apporter. Vous pouvez aussi écrire en privé aux administrateurs à propos de cet événement. Les chats sont supprimés 2 semaines après l'événement."], ["Notifications sur le téléphone", "Activez les notifications dans Réglages (touchez 🔔 et autorisez). Les administrateurs peuvent alors vous envoyer un message qui s'affiche en pop-up dans l'app et en notification sur le téléphone. Vous pouvez la désactiver à tout moment. Sur iPhone, ouvrez d'abord l'app depuis l'écran d'accueil."], ["Proposer une fonction", "Il manque quelque chose, ou vous avez trouvé un bug ? Envoyez-le depuis l'onglet Aide et suivez son statut. Les idées approuvées sont intégrées à l'app."]],
  demo: "La vidéo et les images montrent des événements d'exemple, pas le vrai calendrier." },
es: { lead: "Cada roda, taller, batizado y festival de Formando Congo en una sola app en tu móvil. Mira lo que viene, di que vas y encuentra plaza en un coche.", watch: "▶ Mira los vídeos explicativos", open: "Abrir el calendario", vidH: "Cómo funciona", vidSub: "Empieza por el resumen de 1 minuto y luego elige una pestaña para verla con detalle. Narración y subtítulos en tu idioma; cámbialo arriba.", tours: [["Resumen", "Toda la app en un minuto."], ["Próximos & eventos", "Los próximos eventos, detalles, tiempo, flyers, traducciones, “Voy” y plazas en coche."], ["Agenda", "Lista, mes y año, y filtros por tipo de evento."], ["Estadísticas", "Dónde estuvo Congo: totales, gráficos y el mapa."], ["Ayuda & ideas", "La guía de la app, y cómo sugerir una función o informar de un error y seguirlo."], ["Ajustes", "Aspecto, tu perfil, sin conexión (se abre al instante, se actualiza en segundo plano), la app en tu móvil, idioma y cerrar sesión."], ["Para administradores", "Confirmar eventos y tu rol, plazas en coche, la pestaña Quién va, cómo participó Congo en Estadísticas, y la pestaña Admin con notificaciones (también como aviso en el móvil), la revisión del calendario público, invitaciones, última conexión, informes de error, sugerencias de funciones y tu propio formulario de funciones."]],
  joinH: "Cómo unirte", steps: [["Pide una invitación", "Escribe a Formando Congo, en Instagram @congocapoeira o en persona, con tu dirección de Google (Gmail). O abre la app, entra con Google y toca “Pedir acceso”: Formando Congo ve tu solicitud y puede aceptarla."], ["Abre el enlace en tu móvil", "Usa Safari o Chrome, no el navegador dentro de WhatsApp o Instagram."], ["Entra con Google", "Con la misma cuenta de Google a la que se envió la invitación."], ["Ponla en la pantalla de inicio", "iPhone: Compartir → Añadir a pantalla de inicio. Android: menú ⋮ → Añadir a pantalla de inicio. Así se abre como una app."]],
  featH: "Qué puedes hacer", featSub: "Todo en English, Nederlands, Português, Français, Español, Polski, Українська y Deutsch.",
  f: [["Próximos", "Los próximos eventos con cuenta atrás, nada más abrir la app."], ["Detalles del evento", "Fecha, lugar, programa y un botón para añadirlo a tu calendario o abrirlo en Mapas. Las descripciones se traducen a tu idioma, los flyers y publicaciones de Instagram se ven en la propia descripción, y desde 5 días antes ves la previsión del tiempo."], ["Voy", "Toca “Voy” y el evento se ilumina en naranja en toda la app."], ["Plazas en coche", "Cuando un administrador va en coche, reserva una plaza libre y mira desde dónde y cuándo sale. Por orden de llegada."], ["Agenda", "Todo en lista, por mes o por año, con filtros por tipo de evento."], ["Estadísticas", "Cuántos eventos por año y tipo, cuántos en casa (Bélgica), en Europa y en América, y cada ciudad en el mapa."], ["Tu perfil", "Añade tu nombre de capoeira, elige el idioma y el modo claro u oscuro, y guarda el calendario sin conexión en tu móvil: se abre al instante y se actualiza en segundo plano, y una luz verde, roja o naranja indica en línea, sin conexión o actualizando."], ["Ayuda", "Una guía dentro de la app que crece con cada nueva función."], ["Chat por evento", "¿Vas a un evento? Ábrelo y chatea con los demás que van: quién lleva coche, qué llevar. También puedes escribir en privado a los administradores sobre ese evento. Los chats se borran 2 semanas después del evento."], ["Notificaciones en el móvil", "Activa las notificaciones en Ajustes (toca 🔔 y permite). Los administradores pueden enviarte un mensaje que aparece como aviso en la app y como notificación en el móvil. Puedes desactivarlas cuando quieras. En iPhone, abre primero la app desde la pantalla de inicio."], ["Sugiere una función", "¿Falta algo, o encontraste un error? Envíalo desde la pestaña Ayuda y sigue su estado. Las ideas aprobadas se añaden a la app."]],
  demo: "El vídeo y las imágenes muestran eventos de ejemplo, no el calendario real." },
pl: { lead: "Każda roda, warsztat, batizado i festiwal Formando Congo w jednej aplikacji na twoim telefonie. Zobacz, co nadchodzi, daj znać, że jedziesz, i znajdź miejsce w samochodzie.", watch: "▶ Obejrzyj filmy instruktażowe", open: "Otwórz kalendarz", vidH: "Jak to działa", vidSub: "Zacznij od przeglądu w 1 minutę, potem wybierz kartę, by zobaczyć więcej. Lektor i napisy w twoim języku; zmienisz go u góry.", tours: [["Przegląd", "Cała aplikacja w jedną minutę."], ["Nadchodzące i wydarzenia", "Najbliższe wydarzenia, szczegóły, pogoda, ulotki, tłumaczenia, „Jadę” i miejsca w samochodzie."], ["Kalendarz", "Lista, miesiąc i rok oraz filtry według rodzaju wydarzenia."], ["Statystyki", "Gdzie było Congo: sumy, wykresy i mapa."], ["Pomoc i pomysły", "Wbudowany przewodnik oraz jak zaproponować funkcję lub zgłosić błąd i śledzić go."], ["Ustawienia", "Wygląd, twój profil, dostępne offline (otwiera się od razu, aktualizuje w tle), aplikacja na telefonie, język i wylogowanie."], ["Dla administratorów", "Potwierdzanie wydarzeń i twojej roli, miejsca w samochodzie, karta Kto jedzie z czatami, udział Congo w Statystykach oraz karta Admin z powiadomieniami (także na telefonie), prośby o dostęp, kontrola publicznego kalendarza, zaproszenia, ostatnia aktywność, zgłoszenia błędów, propozycje funkcji i własny formularz funkcji."]],
  joinH: "Jak dołączyć", steps: [["Poproś o zaproszenie", "Napisz do Formando Congo, na Instagramie @congocapoeira albo osobiście, podając swój adres Google (Gmail). Albo otwórz aplikację, zaloguj się przez Google i dotknij „Poproś o dostęp”: Formando Congo zobaczy twoją prośbę i może ją zaakceptować."], ["Otwórz link na telefonie", "Użyj Safari lub Chrome, a nie przeglądarki wewnątrz WhatsAppa czy Instagramu."], ["Zaloguj się przez Google", "Tym samym kontem Google, na które wysłano zaproszenie."], ["Dodaj do ekranu głównego", "iPhone: Udostępnij → Dodaj do ekranu początkowego. Android: menu ⋮ → Dodaj do ekranu głównego. Otwiera się wtedy jak aplikacja."]],
  featH: "Co możesz zrobić", featSub: "Wszystko po English, Nederlands, Português, Français, Español, Polski, Українська i Deutsch.",
  f: [["Nadchodzące", "Najbliższe wydarzenia z odliczaniem, zaraz po otwarciu aplikacji."], ["Szczegóły wydarzenia", "Data, miejsce, program i przycisk, by dodać do własnego kalendarza lub otworzyć w Mapach. Opisy są tłumaczone na twój język, ulotki i posty z Instagramu pokazują się w opisie, a od 5 dni przed widzisz prognozę pogody."], ["Jadę", "Dotknij „Jadę” i wydarzenie świeci się na pomarańczowo w całej aplikacji."], ["Miejsca w samochodzie", "Gdy administrator jedzie autem, zarezerwuj wolne miejsce i zobacz, gdzie i kiedy auto wyjeżdża. Kto pierwszy, ten lepszy."], ["Kalendarz", "Wszystko jako lista, miesiąc lub cały rok, z filtrami według rodzaju wydarzenia."], ["Statystyki", "Ile wydarzeń na rok i rodzaj, ile u nas (Belgia), w Europie i w Ameryce oraz każde miasto na mapie."], ["Twój profil", "Dodaj swoje imię capoeira, wybierz język i jasny lub ciemny tryb oraz zachowaj kalendarz offline na telefonie: otwiera się od razu i aktualizuje w tle, a zielone, czerwone lub pomarańczowe światełko pokazuje online, offline lub aktualizację."], ["Pomoc", "Wbudowany przewodnik, który rośnie z każdą nową funkcją."], ["Czat przy wydarzeniu", "Jedziesz na wydarzenie? Otwórz je i pisz z innymi, którzy jadą: kto prowadzi auto, co zabrać. Możesz też pisać prywatnie z administratorami o tym wydarzeniu. Nieprzeczytane wiadomości podświetlają wydarzenie. Czaty znikają 2 tygodnie po wydarzeniu."], ["Powiadomienia na telefonie", "Włącz powiadomienia w Ustawieniach (dotknij 🔔 i zezwól). Administratorzy mogą wtedy wysłać ci wiadomość widoczną jako okienko w aplikacji i powiadomienie na telefonie, a także powiadamiamy o nowych wiadomościach na czacie. Możesz je w każdej chwili wyłączyć. Na iPhonie najpierw otwórz aplikację z ekranu głównego."], ["Zaproponuj funkcję", "Czegoś brakuje albo znalazłeś błąd? Wyślij to z karty Pomoc i śledź status. Zatwierdzone pomysły trafiają do aplikacji."]],
  demo: "Film i obrazki pokazują przykładowe wydarzenia, a nie prawdziwy kalendarz." },
de: { lead: "Jede Roda, jeder Workshop, jedes Batizado und Festival von Formando Congo in einer App auf deinem Telefon. Sieh, was ansteht, sag, dass du kommst, und finde einen Platz im Auto.", watch: "▶ Video-Anleitungen ansehen", open: "Kalender öffnen", vidH: "So funktioniert es", vidSub: "Beginne mit dem Überblick in 1 Minute und wähle dann einen Tab für mehr Details. Sprecher und Untertitel in deiner Sprache; wechsle sie oben.", tours: [["Überblick", "Die ganze App in einer Minute."], ["Demnächst & Events", "Die nächsten Events, Details, Wetter, Flyer, Übersetzungen, „Ich gehe“ und Plätze im Auto."], ["Kalender", "Liste, Monat und Jahr sowie Filter nach Art des Events."], ["Statistik", "Wo Congo war: Summen, Diagramme und die Karte."], ["Hilfe & Ideen", "Die eingebaute Anleitung und wie du eine Funktion vorschlägst oder einen Fehler meldest und verfolgst."], ["Einstellungen", "Aussehen, dein Profil, offline verfügbar (öffnet sofort, aktualisiert im Hintergrund), die App auf deinem Telefon, Sprache und Abmelden."], ["Für Administratoren", "Events und deine Rolle bestätigen, Plätze im Auto, der Tab Wer geht mit Chats, wie Congo teilnahm in der Statistik und der Tab Admin mit Benachrichtigungen (auch aufs Telefon), Zugangsanfragen, Prüfung des öffentlichen Kalenders, Einladungen, zuletzt online, Fehlermeldungen, Funktionsvorschläge und dein eigenes Funktionsformular."]],
  joinH: "So machst du mit", steps: [["Bitte um eine Einladung", "Schreibe Formando Congo, auf Instagram @congocapoeira oder persönlich, mit deiner Google-Adresse (Gmail). Oder öffne die App, melde dich mit Google an und tippe auf „Zugang anfragen“: Formando Congo sieht deine Anfrage und kann sie annehmen."], ["Öffne den Link auf deinem Telefon", "Nutze Safari oder Chrome, nicht den Browser in WhatsApp oder Instagram."], ["Melde dich mit Google an", "Mit demselben Google-Konto, an das die Einladung ging."], ["Lege sie auf den Startbildschirm", "iPhone: Teilen → Zum Home-Bildschirm. Android: Menü ⋮ → Zum Startbildschirm hinzufügen. Dann öffnet sie sich wie eine App."]],
  featH: "Was du tun kannst", featSub: "Alles auf English, Nederlands, Português, Français, Español, Polski, Українська und Deutsch.",
  f: [["Demnächst", "Die nächsten Events mit Countdown, gleich wenn du die App öffnest."], ["Event-Details", "Datum, Ort, Programm und ein Knopf, um es in deinen Kalender zu legen oder in Karten zu öffnen. Beschreibungen werden in deine Sprache übersetzt, Flyer und Instagram-Beiträge erscheinen direkt in der Beschreibung, und ab 5 Tagen vorher siehst du die Wettervorhersage."], ["Ich gehe", "Tippe auf „Ich gehe“ und das Event leuchtet in der ganzen App orange."], ["Plätze im Auto", "Wenn ein Administrator fährt, reserviere einen freien Platz und sieh, wo und wann das Auto losfährt. Wer zuerst kommt, mahlt zuerst."], ["Kalender", "Alles als Liste, Monat oder ganzes Jahr, mit Filtern nach Art des Events."], ["Statistik", "Wie viele Events pro Jahr und Art, wie viele bei uns (Belgien), in Europa und in Amerika, und jede Stadt auf der Karte."], ["Dein Profil", "Trage deinen Capoeira-Namen ein, wähle Sprache und hellen oder dunklen Modus und halte den Kalender offline auf deinem Telefon: er öffnet sich sofort und aktualisiert im Hintergrund, und ein grünes, rotes oder oranges Licht zeigt online, offline oder Aktualisierung."], ["Hilfe", "Eine eingebaute Anleitung, die mit jeder neuen Funktion wächst."], ["Chat pro Event", "Du gehst zu einem Event? Öffne es und chatte mit den anderen, die gehen: wer fährt, was mitbringen. Du kannst auch privat mit den Administratoren über das Event schreiben. Ungelesene Nachrichten lassen das Event aufleuchten. Chats werden 2 Wochen nach dem Event gelöscht."], ["Benachrichtigungen aufs Telefon", "Schalte Benachrichtigungen in den Einstellungen ein (tippe auf 🔔 und erlaube). Administratoren können dir dann eine Nachricht schicken, die als Pop-up in der App und als Benachrichtigung auf dem Telefon erscheint, und du bekommst auch neue Chatnachrichten. Du kannst sie jederzeit wieder ausschalten. Auf dem iPhone öffne die App zuerst vom Startbildschirm."], ["Funktion vorschlagen", "Fehlt etwas oder hast du einen Fehler gefunden? Sende es über den Tab Hilfe und verfolge den Status. Genehmigte Ideen werden in die App eingebaut."]],
  demo: "Das Video und die Bilder zeigen Beispiel-Events, nicht den echten Kalender." },
uk: { lead: "Кожна рода, воркшоп, батизаду і фестиваль Formando Congo в одному застосунку на вашому телефоні. Бачте, що попереду, повідомте, що їдете, і знайдіть місце в авто.", watch: "▶ Дивитися відеоінструкції", open: "Відкрити календар", vidH: "Як це працює", vidSub: "Почніть з огляду на 1 хвилину, потім виберіть вкладку, щоб дізнатися більше. Дикторський голос і субтитри вашою мовою; змініть її вгорі.", tours: [["Огляд", "Увесь застосунок за одну хвилину."], ["Найближчі й події", "Найближчі події, подробиці, погода, флаєри, переклади, «Я їду» та місця в авто."], ["Календар", "Список, місяць і рік та фільтри за видом події."], ["Статистика", "Де було Congo: підсумки, діаграми та карта."], ["Довідка й ідеї", "Вбудований посібник і як запропонувати функцію або повідомити про помилку та стежити за нею."], ["Налаштування", "Вигляд, ваш профіль, доступно офлайн (відкривається одразу, оновлюється у фоні), застосунок на телефоні, мова і вихід."], ["Для адміністраторів", "Підтвердження подій і вашої ролі, місця в авто, вкладка Хто їде з чатами, участь Congo в Статистиці та вкладка Адмін зі сповіщеннями (також на телефоні), запити на доступ, перевірка публічного календаря, запрошення, остання активність, повідомлення про помилки, пропозиції функцій і ваша власна форма функцій."]],
  joinH: "Як долучитися", steps: [["Попросіть запрошення", "Напишіть Formando Congo в Instagram @congocapoeira або особисто, вказавши свою адресу Google (Gmail). Або відкрийте застосунок, увійдіть через Google і торкніться «Попросити доступ»: Formando Congo побачить ваш запит і зможе його прийняти."], ["Відкрийте посилання на телефоні", "Користуйтеся Safari або Chrome, а не браузером усередині WhatsApp чи Instagram."], ["Увійдіть через Google", "Тим самим акаунтом Google, на який надіслано запрошення."], ["Додайте на головний екран", "iPhone: Поділитися → На екран Додому. Android: меню ⋮ → Додати на головний екран. Тоді він відкривається як застосунок."]],
  featH: "Що ви можете робити", featSub: "Усе мовами English, Nederlands, Português, Français, Español, Polski, Українська та Deutsch.",
  f: [["Найближчі", "Найближчі події з відліком, одразу після відкриття застосунку."], ["Подробиці події", "Дата, місце, програма і кнопка, щоб додати до свого календаря або відкрити в Картах. Описи перекладаються вашою мовою, флаєри й дописи з Instagram показуються в описі, а за 5 днів до події ви бачите прогноз погоди."], ["Я їду", "Торкніться «Я їду», і подія світиться помаранчевим у всьому застосунку."], ["Місця в авто", "Коли адміністратор їде авто, зарезервуйте вільне місце і дивіться, звідки й коли воно виїжджає. Хто перший, того й місце."], ["Календар", "Усе списком, за місяцем або за цілий рік, з фільтрами за видом події."], ["Статистика", "Скільки подій за роком і видом, скільки в нас (Бельгія), у Європі та в Америці, і кожне місто на карті."], ["Ваш профіль", "Додайте своє капоейра-ім’я, виберіть мову та світлий чи темний режим і збережіть календар офлайн на телефоні: він відкривається одразу й оновлюється у фоні, а зелений, червоний чи помаранчевий індикатор показує онлайн, офлайн або оновлення."], ["Довідка", "Вбудований посібник, що зростає з кожною новою функцією."], ["Чат до події", "Їдете на подію? Відкрийте її й спілкуйтеся з іншими, хто їде: хто за кермом, що взяти. Також можна писати приватно адміністраторам про цю подію. Непрочитані повідомлення підсвічують подію. Чати видаляються через 2 тижні після події."], ["Сповіщення на телефоні", "Увімкніть сповіщення в Налаштуваннях (торкніться 🔔 і дозвольте). Адміністратори зможуть надсилати вам повідомлення, що з’являється як спливне вікно в застосунку і як сповіщення на телефоні, а ви отримуватимете й нові повідомлення чату. Їх можна вимкнути будь-коли. На iPhone спершу відкрийте застосунок з головного екрана."], ["Запропонуйте функцію", "Чогось бракує або знайшли помилку? Надішліть це з вкладки Довідка й стежте за статусом. Схвалені ідеї додаються до застосунку."]],
  demo: "Відео та зображення показують приклади подій, а не справжній календар." }
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let L = (() => { const q = new URLSearchParams(location.search).get("lang"); if (T[q]) return q; try { const s = localStorage.getItem("ccc.lang"); if (T[s]) return s; } catch {} const n = (navigator.language || "en").slice(0, 2).toLowerCase(); return T[n] ? n : "en"; })();
const vid = document.getElementById("vid");
const TOURS = ["overview", "events", "agenda", "analytics", "howto", "settings", "organisers"]; let TOUR = 0;
function setLang(l, user) {
  L = l; const d = T[l]; document.documentElement.lang = l;
  if (user) { try { localStorage.setItem("ccc.lang", l); } catch {} }
  document.getElementById("langs").innerHTML = LANGS.map(([k, fl, nm]) => `<button type="button" data-l="${k}" aria-pressed="${k === l}" lang="${k}"><span>${fl}</span><span class="nm">${nm}</span></button>`).join("");
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = d[el.dataset.t]);
  document.getElementById("steps").innerHTML = d.steps.map(([b, s]) => `<li><div><b>${esc(b)}</b><span>${esc(s)}</span></div></li>`).join("");
  document.getElementById("grid").innerHTML = d.f.map(([h, p], i) => `<article class="card"><div class="shot"><img loading="lazy" src="shots/${l}-${SHOTS[i]}.webp" alt="${esc(h)}" width="390" height="664"></div><div class="txt"><h3>${esc(h)}</h3><p>${esc(p)}</p></div></article>`).join("");
  showTour(TOUR, false);
  const u = new URL(location.href); u.searchParams.set("lang", l); history.replaceState(null, "", u);
}
function showTour(i, play) {
  TOUR = i; const d = T[L], v = TOURS[i], base = v === "overview" ? `media/tutorial-${["pl","uk","de"].includes(L) ? "en" : L}` : `media/${v}-${L}`;
  document.getElementById("tours").innerHTML = d.tours.map(([n], k) => `<button type="button" role="tab" data-tour="${k}" aria-selected="${k === i}">${esc(n)}</button>`).join("");
  document.getElementById("tourdesc").innerHTML = `<b>${esc(d.tours[i][0])}</b>${esc(d.tours[i][1])}`;
  const playing = play || !vid.paused;
  vid.poster = v === "overview" ? "media/poster.jpg" : `media/poster-${v}.jpg`;
  vid.innerHTML = `<source src="${base}.mp4" type="video/mp4"><track kind="subtitles" srclang="${L}" label="${LANGS.find(x => x[0] === L)[2]}" src="${base}.vtt" default>`;
  vid.load(); if (playing) vid.play().catch(() => {});
  vid.addEventListener("loadedmetadata", () => { for (const tr of vid.textTracks) tr.mode = "showing"; }, { once: true });
}
document.getElementById("tours").addEventListener("click", e => { const b = e.target.closest("[data-tour]"); if (b) showTour(+b.dataset.tour, true); });
document.getElementById("langs").addEventListener("click", e => { const b = e.target.closest("[data-l]"); if (b) setLang(b.dataset.l, true); });
setLang(L, false);
</script>
