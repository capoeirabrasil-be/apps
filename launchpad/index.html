<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Launchpad · Capoeira Brasil Apps</title><meta name="theme-color" content="#0B121A">
<link rel="icon" href="../CongoCalender/img/favicon-64.png"><link rel="apple-touch-icon" href="../CongoCalender/img/apple-touch-icon.png">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0B121A;color:#fff;font:16px/1.45 system-ui,-apple-system,sans-serif}
main{max-width:560px;margin:0 auto;padding:32px 18px 48px}
h1{font-size:28px;margin:0 0 4px;text-transform:uppercase;letter-spacing:.02em}h1 b{color:#E08A3C}
.sub{color:#AEBBC8;margin:0 0 22px;font-size:14px}
.app{display:flex;gap:14px;align-items:center;padding:14px;border-radius:18px;background:#141D27;margin-bottom:12px}
.icon{width:64px;height:64px;border-radius:15px;flex:none;object-fit:cover;background:#1B2734;display:grid;place-items:center;font-weight:700;font-size:24px;color:#E08A3C}
.info{flex:1;min-width:0}.info strong{display:block}.info small{color:#AEBBC8;display:block}
.links{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.links a{font-size:12px;color:#AEBBC8;text-decoration:none;border:1px solid #2A3A4B;border-radius:999px;padding:3px 10px}
.links a.main{display:none}
.open{flex:none;background:#E08A3C;color:#0B121A;font-weight:700;text-decoration:none;border-radius:999px;padding:9px 16px;font-size:14px}
.open:hover{background:#F09C4E}.empty{color:#AEBBC8}
</style></head>
<body><main>
<h1>Capoeira Brasil <b>Launchpad</b></h1>
<p class="sub" id="sub">Tap Open to get the app.</p>
<div id="list"></div>
</main>
<script>
(function(){
  var ua = navigator.userAgent || "";
  // iPadOS reports itself as a Mac, so also check for touch.
  var ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var android = /Android/i.test(ua);
  var os = ios ? "ios" : android ? "android" : "desktop";
  document.getElementById("sub").textContent =
    os === "ios" ? "Tap Open to get the app for your iPhone." :
    os === "android" ? "Tap Open to get the app for your Android phone." :
    "Click Open to use the app in your browser.";

  // Best link for this device: its own store first, then the web app, then any other link.
  function best(a){
    if (os === "ios" && a.appstore) return {url:a.appstore, label:"App Store"};
    if (os === "android" && a.playstore) return {url:a.playstore, label:"Google Play"};
    if (a.web) return {url:a.web, label:"Web app"};
    if (a.appstore) return {url:a.appstore, label:"App Store"};
    if (a.playstore) return {url:a.playstore, label:"Google Play"};
    return null;
  }
  function esc(s){return String(s||"").replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

  fetch("apps.json", {cache:"no-cache"}).then(function(r){return r.json();}).then(function(data){
    var apps = (data.apps || []).filter(function(a){return a && a.name;});
    // apps.capoeirabrasil.be/launchpad/?app=<id> sends the visitor straight to the right place.
    var want = new URLSearchParams(location.search).get("app");
    if (want) {
      var hit = apps.filter(function(a){return a.id === want;})[0];
      var b = hit && best(hit);
      if (b) { location.replace(b.url); return; }
    }
    var list = document.getElementById("list");
    if (!apps.length) { list.innerHTML = '<p class="empty">No apps yet.</p>'; return; }
    list.innerHTML = apps.map(function(a){
      var b = best(a);
      var icon = a.icon
        ? '<img class="icon" src="'+esc(a.icon)+'" alt="" loading="lazy">'
        : '<div class="icon">'+esc(a.name.trim().charAt(0).toUpperCase())+'</div>';
      var links = [];
      if (a.web) links.push('<a href="'+esc(a.web)+'">Web</a>');
      if (a.appstore) links.push('<a href="'+esc(a.appstore)+'">App Store</a>');
      if (a.playstore) links.push('<a href="'+esc(a.playstore)+'">Google Play</a>');
      return '<div class="app">'+icon+'<div class="info"><strong>'+esc(a.name)+'</strong>'+
        (a.description ? '<small>'+esc(a.description)+'</small>' : '')+
        (links.length > 1 ? '<div class="links">'+links.join("")+'</div>' : '')+
        '</div>'+(b ? '<a class="open" href="'+esc(b.url)+'" title="'+esc(b.label)+'">Open</a>' : '')+'</div>';
    }).join("");
  }).catch(function(){
    document.getElementById("list").innerHTML = '<p class="empty">Could not load the app list.</p>';
  });
})();
</script>
</body></html>
